name: Build packaged Bonsai tools
description: Build the pinned native Windows ARM64 maintenance CLI once for a job.
runs:
  using: composite
  steps:
    - name: Install and identify the pinned native Rust compiler
      shell: pwsh
      working-directory: ${{ runner.temp }}
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        rustup toolchain install 1.99.1-aarch64-pc-windows-msvc --profile minimal --no-self-update
        $identity = rustc +1.99.1-aarch64-pc-windows-msvc -vV
        if ($identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
        "BONSAI_TOOLS_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
        "BONSAI_TOOLS_TARGET=$(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PackagedTools')" >> $env:GITHUB_ENV
        "BONSAI_TOOLS_BUILD_EVIDENCE=$(Join-Path $env:RUNNER_TEMP ('SwiftBonsai-ToolsBuild-' + [guid]::NewGuid().ToString('N')))" >> $env:GITHUB_ENV
    - name: Reuse Cargo downloads and native tool build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ${{ env.BONSAI_TOOLS_TARGET }}
        key: bonsai-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BONSAI_TOOLS_CACHE_HOST }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/bonsai/**', 'src/windows-*/**', 'rust-toolchain.toml') }}
        restore-keys: |
          bonsai-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BONSAI_TOOLS_CACHE_HOST }}-1.99.1-
    - name: Build the packaged CLI and select it for script invocations
      shell: pwsh
      working-directory: ${{ runner.temp }}
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Rust.ps1') -Package bonsai-tools -Phase build -TargetDirectory $env:BONSAI_TOOLS_TARGET -EvidenceDirectory $env:BONSAI_TOOLS_BUILD_EVIDENCE | ConvertTo-Json -Depth 8
        $tool = Join-Path $env:BONSAI_TOOLS_TARGET 'release/bonsai-tools.exe'
        if (-not [IO.File]::Exists($tool)) { throw 'Packaged maintenance CLI build output is missing.' }
        "BONSAI_TOOLS_PATH=$tool" >> $env:GITHUB_ENV
    - name: Retain packaged CLI build evidence
      if: always() && env.BONSAI_TOOLS_BUILD_EVIDENCE != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tools-build-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.BONSAI_TOOLS_BUILD_EVIDENCE }}
        if-no-files-found: error
