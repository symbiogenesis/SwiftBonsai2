name: Dependency trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: Windows 11 ARM64 / new solver and Polonius
    if: github.ref == 'refs/heads/main' && github.repository == 'symbiogenesis/SwiftBonsai2'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve external evidence storage
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-DependencyTrial-' + [guid]::NewGuid().ToString('N'))
          if (-not [IO.Path]::IsPathFullyQualified($evidence) -or $evidence -match '%[^%]+%') { throw 'Expected an expanded absolute evidence path.' }
          "DEPENDENCY_TRIAL_EVIDENCE=$evidence" >> $env:GITHUB_ENV
      - name: Verify and measure pinned dependency candidates
        id: compare
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          try {
            & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-DependencyTrial.ps1') -EvidenceDirectory $env:DEPENDENCY_TRIAL_EVIDENCE
          } catch {
            [void][IO.Directory]::CreateDirectory($env:DEPENDENCY_TRIAL_EVIDENCE)
            $_ | Out-String | Set-Content -LiteralPath (Join-Path $env:DEPENDENCY_TRIAL_EVIDENCE 'failure.txt') -Encoding utf8
            throw
          }
      - name: Record trial outcome
        if: always()
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          TRIAL_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          @('', "Dependency trial outcome: $env:TRIAL_OUTCOME", "Tested revision: $env:GITHUB_SHA") >> $env:GITHUB_STEP_SUMMARY
      - name: Retain raw results, selection and native evidence
        if: always() && env.DEPENDENCY_TRIAL_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEPENDENCY_TRIAL_EVIDENCE }}
          if-no-files-found: error
