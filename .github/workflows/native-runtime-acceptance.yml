name: Native Rust actual-model application acceptance
run-name: Native Rust actual-model application acceptance (${{ inputs.profile }})
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Explicit bounded profile; all setup/model work/cleanup shares one five-minute job
        type: choice
        options: [pq2-no-adapter, ptq1-adapter, pq2-adapter-row4]
        default: pq2-no-adapter
        required: false
      bounded_history:
        description: PQ2 no-adapter only; 128 history repetitions, four-token stream and same-owner reuse within the same budget
        type: boolean
        default: false
        required: false
      stalled_consumer:
        description: PQ2 no-adapter only; Stop after first visible content and one second without reads, then fresh-owner recovery
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  # Actual-model captures share the physical laptop and memory budget.
  group: swift-lora-snapdragon
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check bounded credential-free startup diagnostic retention
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/Test-NativeStartupDiagnostics.ps1
      - uses: ./.github/actions/bonsai-tools
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Build exact acceptance binary without executing model tests
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $package = Join-Path $env:RUNNER_TEMP 'Native-Acceptance-Package'
          [void][IO.Directory]::CreateDirectory($package)
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'Native-Acceptance-Build'
          $messages = Join-Path $env:RUNNER_TEMP 'native-acceptance-build.jsonl'
          $cargo = (Get-Command cargo -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          & $cargo +nightly-2026-10-22 test --locked --release --no-run --message-format=json --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-broker --test native_model | Set-Content -LiteralPath $messages -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Hosted acceptance binary build failed.' }
          $artifacts = @(Get-Content -LiteralPath $messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -ceq 'compiler-artifact' -and $_.target.name -ceq 'native_model' -and $_.executable })
          if ($artifacts.Count -ne 1) { throw 'Exactly one native_model test binary is required.' }
          Copy-Item -LiteralPath $artifacts[0].executable -Destination (Join-Path $package 'native-model-acceptance.exe')
          $modelFreeCases = @(& (Join-Path $package 'native-model-acceptance.exe') --list)
          if ($LASTEXITCODE -ne 0) { throw 'Hosted acceptance case inventory failed.' }
          foreach ($case in @('native_profile_selection_and_scale_receipts_preserve_bounded_scope', 'native_row4_profile_is_explicit_original_pq2_and_one_stream_only',
              'native_bounded_history_and_stall_requests_preserve_distinct_output_limits',
              'native_extended_acceptance_distinguishes_output_usage_from_delta_count',
              'native_stalled_consumer_retains_fragmented_prefix_connection_until_dropped',
              'native_stalled_consumer_never_qualifies_natural_completion_as_interruption',
              'native_stalled_consumer_rejects_error_or_unframed_stream_headers',
              'native_case_budget_rejects_missing_unbounded_and_malformed_allowances',
              'native_case_budget_cancels_owned_tasks_before_followup')) {
            if ($modelFreeCases -cnotcontains ($case + ': test')) { throw 'Required hosted acceptance regression was not found.' }
            & (Join-Path $package 'native-model-acceptance.exe') $case --exact
            if ($LASTEXITCODE -ne 0) { throw 'Hosted acceptance profile/argument checks failed.' }
          }
          Copy-Item -LiteralPath $env:BONSAI_TOOLS_PATH -Destination (Join-Path $package 'bonsai-tools.exe')
          $files = @('native-model-acceptance.exe', 'bonsai-tools.exe') | ForEach-Object {
            $path = Join-Path $package $_
            [ordered]@{ Name=$_; Bytes=(Get-Item -LiteralPath $path).Length; Sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          [ordered]@{
            SchemaVersion=1; Revision=$env:GITHUB_SHA; RunId=$env:GITHUB_RUN_ID; RunAttempt=$env:GITHUB_RUN_ATTEMPT
            Toolchain='nightly-2026-10-22-aarch64-pc-windows-msvc'; CompilerIdentity=(& rustc +nightly-2026-10-22 -vV) -join "`n"
            ToolsSourceId=$env:BONSAI_TOOLS_SOURCE_ID; Files=@($files); ModelExecuted=$false
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $package 'receipt.json') -Encoding utf8NoBOM
          "BONSAI_ACCEPTANCE_PACKAGE=$package" >> $env:GITHUB_ENV
      - name: Retain public-source binaries and source/digest receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-acceptance-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_ACCEPTANCE_PACKAGE }}
          if-no-files-found: error
          retention-days: 90

  acceptance:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    # Register one ephemeral Windows ARM64 owner runner with only this run label.
    # A run-specific label prevents another queued device workload from matching it.
    runs-on: ${{ format('native-acceptance-{0}', github.run_id) }}
    timeout-minutes: 5
    env:
      BONSAI_NATIVE_DIAGNOSTICS_READY: 'false'
    steps:
      - name: Start the complete owner-job budget before checkout and tool intake
        shell: pwsh
        run: |
          "BONSAI_NATIVE_JOB_STARTED_UTC=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact hosted acceptance package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-acceptance-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Native-Acceptance-Package
      - name: Prepare private external working and evidence directories
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP ('Native-Runtime-Acceptance-' + [guid]::NewGuid().ToString('N'))
          foreach ($name in @('work', 'evidence')) {
            [void][IO.Directory]::CreateDirectory((Join-Path $root $name))
          }
          "BONSAI_NATIVE_WORK=$(Join-Path $root 'work')" >> $env:GITHUB_ENV
          "BONSAI_NATIVE_EVIDENCE=$(Join-Path $root 'evidence')" >> $env:GITHUB_ENV
          "BONSAI_NATIVE_DATA=$(Join-Path $env:LOCALAPPDATA 'SwiftBonsai2')" >> $env:GITHUB_ENV
          $package = Join-Path $env:RUNNER_TEMP 'Native-Acceptance-Package'
          $receiptPath = Join-Path $package 'receipt.json'
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.SchemaVersion -ne 1 -or $receipt.Revision -cne $env:GITHUB_SHA -or
              $receipt.RunId -cne $env:GITHUB_RUN_ID -or $receipt.RunAttempt -cne $env:GITHUB_RUN_ATTEMPT -or
              $receipt.Toolchain -cne 'nightly-2026-10-22-aarch64-pc-windows-msvc' -or
              $receipt.ModelExecuted -ne $false -or $receipt.ToolsSourceId -cnotmatch '^[a-f0-9]{64}$' -or
              [string]::IsNullOrWhiteSpace($receipt.CompilerIdentity) -or @($receipt.Files).Count -ne 2) { throw 'Hosted acceptance source/run identity mismatch.' }
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Common.psm1')
          foreach ($name in @('native-model-acceptance.exe', 'bonsai-tools.exe')) {
            $matching = @($receipt.Files | Where-Object Name -CEQ $name)
            $path = Join-Path $package $name
            if ($matching.Count -ne 1 -or (Get-Item -LiteralPath $path).Length -ne $matching[0].Bytes -or
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $matching[0].Sha256) { throw 'Hosted acceptance binary digest mismatch.' }
            Assert-Arm64PE -Path $path
          }
          Copy-Item -LiteralPath $receiptPath -Destination (Join-Path $root 'evidence/hosted-build.json')
          "BONSAI_NATIVE_TEST=$(Join-Path $package 'native-model-acceptance.exe')" >> $env:GITHUB_ENV
          "BONSAI_TOOLS_PATH=$(Join-Path $package 'bonsai-tools.exe')" >> $env:GITHUB_ENV
      - name: Verify already provisioned pinned release without downloading weights
        shell: pwsh
        working-directory: ${{ env.BONSAI_NATIVE_WORK }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Get-Inference.ps1') -DataDirectory $env:BONSAI_NATIVE_DATA -VerifyOnly
      - name: Exercise actual-model broker lifecycle under the required native sandbox
        shell: pwsh
        working-directory: ${{ env.BONSAI_NATIVE_WORK }}
        env:
          BONSAI_NATIVE_PROFILE: ${{ inputs.profile }}
          BONSAI_NATIVE_EXTENDED: ${{ inputs.bounded_history }}
          BONSAI_NATIVE_STALLED_CONSUMER: ${{ inputs.stalled_consumer }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          [Environment]::CurrentDirectory = $env:BONSAI_NATIVE_WORK
          $cpu = Get-CimInstance Win32_Processor -OperationTimeoutSec 10 | Select-Object -First 1
          if ($cpu.Name -notmatch 'Snapdragon.*X.*Elite') { throw 'Actual Snapdragon X/X2 Elite identity is required; no generic ARM substitute.' }
          $hostReport = [ordered]@{
            SchemaVersion=1; Revision=$env:GITHUB_SHA; RunId=$env:GITHUB_RUN_ID
            RunAttempt=$env:GITHUB_RUN_ATTEMPT; Cpu=$cpu.Name
            Os=[Environment]::OSVersion.VersionString
            Architecture=[Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            Profile=$env:BONSAI_NATIVE_PROFILE
            BoundedHistoryRequested=($env:BONSAI_NATIVE_EXTENDED -eq 'true')
            StalledConsumerRequested=($env:BONSAI_NATIVE_STALLED_CONSUMER -eq 'true')
            AcceptanceProcessExitCode=$null; AggregateBudgetExpired=$false
            OwnerJobStartedUtc=$env:BONSAI_NATIVE_JOB_STARTED_UTC
            WholeJobMaximumSeconds=300; PostProcessReserveSeconds=30
            PreparationElapsedMilliseconds=$null; ModelCaseBudgetSeconds=$null
            TestProcessHardLimitSeconds=$null
            StartupDiagnosticsReceipt='startup-diagnostics.json'
            StartupDiagnosticsReady=$false; StartupDiagnosticsClassification='not-collected'
            StartupFailureMarkers=@()
            Passed=$false; DefaultRuntimeQualified=$false
            AllRequestedWorkloadsPassed=$null
          }
          try {
            $case = switch -CaseSensitive ($env:BONSAI_NATIVE_PROFILE) {
              'pq2-no-adapter' { 'pinned_native_model_streams_recovers_and_restarts_in_required_sandbox' }
              'ptq1-adapter' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded PTQ1 adapter profile does not admit extended_history or stalled_consumer.'
                }
                'pinned_native_ptq1_adapter_starts_and_streams_within_device_budget'
              }
              'pq2-adapter-row4' {
                if ($env:BONSAI_NATIVE_EXTENDED -ceq 'true' -or $env:BONSAI_NATIVE_STALLED_CONSUMER -ceq 'true') {
                  throw 'The bounded PQ2 four-row adapter profile does not admit extended_history or stalled_consumer.'
                }
                'pinned_native_pq2_adapter_row4_starts_and_streams_within_device_budget'
              }
              default { throw 'Unknown actual-model acceptance profile.' }
            }
            $test = $env:BONSAI_NATIVE_TEST
            $listed = @(& $test --list --ignored)
            if ($LASTEXITCODE -ne 0 -or $listed -cnotcontains ($case + ': test')) { throw 'Required actual-model case was not found.' }
            # The model owner must not inherit Actions' artifact/OIDC/GitHub
            # credentials. Scope this omission to the test child; retain the
            # complete Windows/profile environment and the production guard.
            $start = [Diagnostics.ProcessStartInfo]::new($test)
            $start.WorkingDirectory = $env:BONSAI_NATIVE_WORK
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in @($case, '--exact', '--ignored', '--nocapture')) {
              $start.ArgumentList.Add($argument)
            }
            $jobStarted = [DateTime]::Parse($env:BONSAI_NATIVE_JOB_STARTED_UTC, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
            $setupElapsed = ([DateTime]::UtcNow - $jobStarted).TotalSeconds
            # Charge checkout, hosted-binary intake, verification and inventory.
            # Reserve ten seconds between the Rust soft limit and process limit,
            # then thirty seconds for forced teardown, diagnostics and uploads.
            $hardLimitSeconds = [int][Math]::Floor([Math]::Min(250, 270 - $setupElapsed))
            $caseBudgetSeconds = [Math]::Min(240, $hardLimitSeconds - 10)
            if ($setupElapsed -lt 0 -or $caseBudgetSeconds -lt 1) {
              $hostReport.AggregateBudgetExpired = $true
              throw 'Owner-job preparation exhausted the acceptance budget; qualification remains pending.'
            }
            $hostReport.PreparationElapsedMilliseconds = [Math]::Ceiling($setupElapsed * 1000)
            $hostReport.ModelCaseBudgetSeconds = $caseBudgetSeconds
            $hostReport.TestProcessHardLimitSeconds = $hardLimitSeconds
            $start.Environment['BONSAI_NATIVE_CASE_BUDGET_SECONDS'] = [string]$caseBudgetSeconds
            foreach ($name in @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNNER_INPUT_TOKEN')) {
              [void]$start.Environment.Remove($name)
            }
            $child = [Diagnostics.Process]::Start($start)
            try {
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit($hardLimitSeconds * 1000)) {
                $hostReport.AggregateBudgetExpired = $true
                throw 'The acceptance process exceeded its remaining owner-job budget.'
              }
              [Console]::Out.Write($stdout.GetAwaiter().GetResult())
              $testStderr = $stderr.GetAwaiter().GetResult()
              [Console]::Error.Write($testStderr)
              # Retain only fixed broker classifications, never arbitrary
              # test stderr or native arguments in this public JSON receipt.
              $marker = '(?m)^Native backend startup failure: stage=(authenticated-readiness|native-identity), error=(Backend|Memory|Cancelled), process=(running|status-unavailable|exited-0x[0-9A-F]{8})\r?$'
              $hostReport.StartupFailureMarkers = @([regex]::Matches($testStderr, $marker) | ForEach-Object { $_.Value.TrimEnd("`r") })
              $code = $child.ExitCode
              $hostReport.AcceptanceProcessExitCode = $code
            } finally {
              try {
                if (-not $child.HasExited) {
                  $child.Kill($true)
                  if (-not $child.WaitForExit(10000)) { throw 'Native acceptance cleanup did not finish within ten seconds.' }
                }
              } finally { $child.Dispose() }
            }
            if ($code -ne 0) { throw 'Actual-model application acceptance failed.' }
            $receipt = Join-Path $env:BONSAI_NATIVE_EVIDENCE 'acceptance.json'
            if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) { throw 'Actual-model acceptance receipt is missing.' }
            if ($env:BONSAI_NATIVE_PROFILE -ceq 'pq2-no-adapter') {
              $accepted = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
              $hostReport.AllRequestedWorkloadsPassed = $accepted.allRequestedWorkloadsPassed
            }
            $hostReport.Passed = $true
          } finally {
            $env:BONSAI_NATIVE_DIAGNOSTICS_READY = 'false'
            $env:BONSAI_NATIVE_DIAGNOSTICS_STATUS = 'collection-failed'
            'BONSAI_NATIVE_DIAGNOSTICS_READY=false' >> $env:GITHUB_ENV
            try {
              & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Save-NativeStartupDiagnostics.ps1') `
                -EvidenceDirectory $env:BONSAI_NATIVE_EVIDENCE `
                -AcceptanceExitCode $hostReport.AcceptanceProcessExitCode `
                -BudgetExpired:$hostReport.AggregateBudgetExpired
            } finally {
              $hostReport.StartupDiagnosticsReady = $env:BONSAI_NATIVE_DIAGNOSTICS_READY -ceq 'true'
              $hostReport.StartupDiagnosticsClassification = $env:BONSAI_NATIVE_DIAGNOSTICS_STATUS
              ('BONSAI_NATIVE_DIAGNOSTICS_READY=' + $env:BONSAI_NATIVE_DIAGNOSTICS_READY) >> $env:GITHUB_ENV
              $hostReport | ConvertTo-Json -Depth 4 |
                Set-Content -LiteralPath (Join-Path $env:BONSAI_NATIVE_EVIDENCE 'host.json') -Encoding utf8NoBOM
            }
          }
          $profileScope = if ($env:BONSAI_NATIVE_PROFILE -ceq 'ptq1-adapter') {
            'PTQ1 with the approved adapter requires one scale-1.3 four-token stream; scale-zero and invalid-scale/reuse checks run only within the same budget. Unrun multi-scale, history, context and restart gates remain pending.'
          } elseif ($env:BONSAI_NATIVE_PROFILE -ceq 'pq2-adapter-row4') {
            'Original PQ2 with the approved adapter explicitly configures four native row workers and requires exactly one scale-1.3 four-token-cap stream, verified model/adapter readiness and owned cleanup. This does not independently observe thread count or establish TPS. Multi-scale, rejection/reuse, history, context, restart, performance and quality gates remain unrun.'
          } else {
            'No adapter was enabled. Full-context numerical/resource, performance, quality and daily-service qualification remain separate.'
          }
          @('Bounded actual-model Rust application lifecycle passed under required native containment.',
            ('Explicit acceptance profile: ' + $env:BONSAI_NATIVE_PROFILE),
            'All setup, model loading, execution and cleanup share one five-minute job. Actual-model cases receive at most 240 seconds, reduced by checkout, intake and verification time, with separate process teardown and evidence reserves. Do not split a matrix into repeated jobs.',
            ('Bounded supplied history (128 repetitions, four-token cap) requested: ' + $env:BONSAI_NATIVE_EXTENDED),
            ('Explicit Stop with a nonreading connected client requested: ' + $env:BONSAI_NATIVE_STALLED_CONSUMER),
            'The stalled-client workload requires an interrupted broker operation, bounded owned shutdown and fresh-owner recovery; it does not prove socket-buffer saturation or that the backend was still generating at Stop.',
            'Bounded history records framing, termination and reported output usage. The stalled request reserves 4096 tokens but Stop follows its first visible prefix; neither workload proves 4096 generated tokens or exact 8K occupancy.',
            'Each optional workload requires more than 120 seconds remaining for cleanup and fresh-owner recovery; skipped requests remain pending. Read allRequestedWorkloadsPassed independently of lifecycle success in acceptance.json.',
            $profileScope,
            'This workflow cannot promote the default runtime.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain only credential-free acceptance receipts
        if: always() && env.BONSAI_NATIVE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          # Protected child directories contain keys. Never upload recursively.
          path: |
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/acceptance.json
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/host.json
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/hosted-build.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain only verified regular sanitized diagnostic files
        if: always() && env.BONSAI_NATIVE_DIAGNOSTICS_READY == 'true' && env.BONSAI_NATIVE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-startup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          # A failed/unsafe collection skips this entire artifact, including JSON.
          path: |
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/startup-diagnostics.json
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/startup-backend.stdout.txt
            ${{ env.BONSAI_NATIVE_EVIDENCE }}/startup-backend.stderr.txt
          if-no-files-found: error
          retention-days: 90
