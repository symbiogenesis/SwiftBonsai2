name: BITCOS synthetic ARM64 comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bitcos-synthetic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comparison:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Identify the native build cache
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:ImageOS -or -not $env:ImageVersion) { throw 'Hosted runner image identity is required for native build caching.' }
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Common.psm1') -Force
          $build = Resolve-ExternalPath (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Bitcos/build')
          $source = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'tools/bitcos'))
          $layout = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$source`n$build")))
          "BITCOS_BUILD_DIRECTORY=$build" >> $env:GITHUB_ENV
          "BITCOS_CACHE_LAYOUT=$layout" >> $env:GITHUB_ENV
          "BITCOS_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "BITCOS_CACHE_DOTPROD=$([Runtime.Intrinsics.Arm.Dp]::IsSupported)" >> $env:GITHUB_ENV
      - name: Reuse matching CMake compiler discovery and intermediates
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.BITCOS_BUILD_DIRECTORY }}
          # Shared with Foundation. Exact inputs, image and absolute layout only;
          # configuration, build, PE checks and fixed samples still always run.
          key: bitcos-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BITCOS_CACHE_HOST }}-${{ env.BITCOS_CACHE_DOTPROD }}-${{ env.BITCOS_CACHE_LAYOUT }}-${{ hashFiles('tools/bitcos/**', 'scripts/Build-BitcosPrototype.ps1', 'scripts/Bonsai.Common.psm1') }}
      - name: Build and compare identical synthetic inputs
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $receipt = & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Build-BitcosPrototype.ps1') -BuildDirectory $env:BITCOS_BUILD_DIRECTORY
          $identity = [ordered]@{
            Revision = $env:GITHUB_SHA
            RunnerArchitecture = $env:RUNNER_ARCH
            ImageOS = $env:ImageOS
            ImageVersion = $env:ImageVersion
            Processor = (Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors)
            Build = $receipt
            Scope = 'Hosted ARM64 single-thread synthetic kernels; no model weights, laptop/end-to-end/LoRA performance verdict'
          }
          $identity | ConvertTo-Json -Depth 8
          $start = [Diagnostics.ProcessStartInfo]::new($receipt.BenchmarkExecutable)
          $start.WorkingDirectory = $receipt.EvidenceDirectory
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.ArgumentList.Add('--ci-synthetic')
          $process = [Diagnostics.Process]::Start($start)
          try {
            $stdout = $process.StandardOutput.ReadToEndAsync()
            $stderr = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(180000)) { $process.Kill($true); $process.WaitForExit(); throw 'Synthetic comparison exceeded three minutes.' }
            $results = $stdout.GetAwaiter().GetResult()
            $errors = $stderr.GetAwaiter().GetResult()
            $results
            $errors
            if ($process.ExitCode) { throw 'Synthetic comparison failed.' }
            $rows = @($results -split '\r?\n' | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json })
            if ($rows.Count -ne 18) { throw 'Expected three samples of three kernels at two footprints.' }
            $summary = @('Hosted ARM64 synthetic comparison. This does not qualify Snapdragon model or LoRA performance.', '', '| Footprint | Kernel | Median ns | Weight bytes |', '| --- | --- | ---: | ---: |')
            foreach ($group in ($rows | Group-Object mode,kernel)) {
              $samples = @($group.Group | Sort-Object elapsed_ns)
              $summary += "| $($samples[1].mode) | $($samples[1].kernel) | $($samples[1].elapsed_ns) | $($samples[1].weight_bytes) |"
            }
            $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } finally { $process.Dispose() }
