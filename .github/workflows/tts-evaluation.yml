name: Native ARM64 TTS comparison
on:
  workflow_dispatch:
    inputs:
      target:
        description: Snapdragon remains pending a bounded prepared workload; this matrix is hosted only
        type: choice
        options: [hosted-arm64, snapdragon]
        default: hosted-arm64
      repetitions:
        description: Fresh paired processes per thread count, each with bootstrap and warm synthesis (1-3)
        type: choice
        options: ['1', '2', '3']
        default: '2'
      response_format:
        description: PCM streams for early sound; WAV measures buffered generation
        type: choice
        options: [pcm, wav]
        default: pcm
permissions:
  contents: read
concurrency:
  # Preserve dispatch compatibility; the Snapdragon target rejects on a hosted
  # runner before checkout, build or download and never queues laptop work.
  group: ${{ inputs.target == 'snapdragon' && 'swift-lora-snapdragon' || 'tts-evaluation-hosted-arm64' }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - name: Reject the unbounded owner-device matrix before setup
        shell: pwsh
        env:
          EVALUATION_TARGET: ${{ inputs.target }}
        run: |
          if ($env:EVALUATION_TARGET -cne 'hosted-arm64') {
            throw 'The complete TTS matrix is hosted-only. Snapdragon speech qualification remains pending a hosted-prepared workload within the complete five-minute owner-device budget, including setup and cleanup.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build or verify the exact packaged maintenance tools
        uses: ./.github/actions/bonsai-tools
      - name: Select the native Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Capture paired TTS timing and listening samples
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          EVALUATION_REPETITIONS: ${{ inputs.repetitions }}
          EVALUATION_FORMAT: ${{ inputs.response_format }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-TtsEvaluation.ps1'
          $data = Join-Path $env:RUNNER_TEMP 'Bonsai-TtsEvaluationData'
          $result = & $script -DataDirectory $data -Repetitions ([int]$env:EVALUATION_REPETITIONS) -ResponseFormat $env:EVALUATION_FORMAT
          $result | ConvertTo-Json -Depth 8
          $report = Get-Content -LiteralPath $result.ReportPath -Raw | ConvertFrom-Json
          @('CPU: ' + $report.Cpu,
            'These measurements describe this runner only. Hosted ARM64 results do not qualify Snapdragon performance.',
            'Q8_0 remains the default. Voice quality requires independent listening to the retained synthetic WAV clips.',
            'Phase private/working-set maxima are sampled every 25 ms; the working-set and Job high-water counters cover each complete process lifetime.',
            'Design and Base never coexist; their file reductions must not be added as RAM savings.',
            'Quality verdict: ' + $report.QualityVerdict) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          $report.Records | Select-Object Quantization, Threads, Iteration, PairPosition, Phase, ColdReadyMs, FirstBodyMs, InferenceMs, AudioSeconds, RealTimeFactor |
            ConvertTo-Json | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          $report.Comparisons | ConvertTo-Json | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain timings and public synthetic listening clips
        if: always() && env.BONSAI_TTS_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tts-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_TTS_EVIDENCE }}/tts-evaluation.json
            ${{ env.BONSAI_TTS_EVIDENCE }}/**/memory.json
            ${{ env.BONSAI_TTS_EVIDENCE }}/**/started.json
            ${{ env.BONSAI_TTS_EVIDENCE }}/**/service.stdout
            ${{ env.BONSAI_TTS_EVIDENCE }}/**/service.stderr
            ${{ env.BONSAI_TTS_EVIDENCE }}/**/supervisor.stdout
            ${{ env.BONSAI_TTS_EVIDENCE }}/**/supervisor.stderr
            ${{ env.BONSAI_TTS_EVIDENCE }}/**/*.wav
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
