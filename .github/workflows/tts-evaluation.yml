name: Native ARM64 TTS comparison
on:
  workflow_dispatch:
    inputs:
      target:
        description: Hosted ARM64 is not a Snapdragon performance qualification
        type: choice
        options: [hosted-arm64, snapdragon]
        default: hosted-arm64
      repetitions:
        description: Warm synthesis repetitions per quantization and thread count (1-3)
        type: choice
        options: ['1', '2', '3']
        default: '2'
      response_format:
        description: PCM streams for early sound; WAV measures buffered generation
        type: choice
        options: [pcm, wav]
        default: pcm
permissions:
  contents: read
concurrency:
  group: tts-evaluation-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(inputs.target == 'snapdragon' && '["self-hosted","Windows","ARM64","swift-bonsai-snapdragon"]' || '"windows-11-arm"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build or verify the exact packaged maintenance tools
        uses: ./.github/actions/bonsai-tools
      - name: Select the native Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Capture paired TTS timing and listening samples
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          EVALUATION_REPETITIONS: ${{ inputs.repetitions }}
          EVALUATION_FORMAT: ${{ inputs.response_format }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-TtsEvaluation.ps1'
          $data = Join-Path $env:RUNNER_TEMP 'Bonsai-TtsEvaluationData'
          $result = & $script -DataDirectory $data -Repetitions ([int]$env:EVALUATION_REPETITIONS) -ResponseFormat $env:EVALUATION_FORMAT
          $result | ConvertTo-Json -Depth 8
          $report = Get-Content -LiteralPath $result.ReportPath -Raw | ConvertFrom-Json
          @('CPU: ' + $report.Cpu,
            'These measurements describe this runner only. Hosted ARM64 results do not qualify Snapdragon performance.',
            'Q8_0 remains the default. Voice quality requires independent listening to the retained synthetic WAV clips.',
            'Quality verdict: ' + $report.QualityVerdict) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          $report.Records | Select-Object Quantization, Threads, Iteration, ColdReadyMs, FirstBodyMs, InferenceMs, AudioSeconds, RealTimeFactor |
            ConvertTo-Json | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain timings and public synthetic listening clips
        if: always() && env.BONSAI_TTS_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tts-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_TTS_EVIDENCE }}/tts-evaluation.json
            ${{ env.BONSAI_TTS_EVIDENCE }}/**/*.wav
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
