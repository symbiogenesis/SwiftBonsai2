name: JSON parser candidate comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: json-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Record the immutable parser and host identities
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $evidence = Join-Path $env:RUNNER_TEMP ('Bonsai-JsonCandidate-' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($evidence)
          "BONSAI_JSON_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $evidence 'target')" >> $env:GITHUB_ENV
          $source = git -C (Join-Path $env:GITHUB_WORKSPACE 'third_party/simd-json') rev-parse HEAD
          if ($source -cne '00a71f6a931f7f365c23d7fc8d1f84ad693304d3') { throw 'Unexpected candidate source revision.' }
          [ordered]@{
            Revision = $env:GITHUB_SHA
            ParserSource = $source
            ParserPath = 'padded-tape-serde-reuse'
            Compiler = (cargo +nightly-2026-10-22-aarch64-pc-windows-msvc --version)
            Rustc = (rustc +nightly-2026-10-22-aarch64-pc-windows-msvc -vV)
            OS = [Environment]::OSVersion.VersionString
            Architecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            CPU = @(Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors)
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $evidence 'identity.json')
      - name: Check strict parser parity before timing
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc test --release --locked --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') -p bonsai-broker --features json-candidate --lib json_candidate::fixed_candidate_
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc test --release --locked --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') -p bonsai-broker --features json-candidate --lib json_candidate_parser::tests::
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc test --release --locked --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') -p bonsai-broker --features json-candidate --test request_policy
      - name: Compare cold and reused immutable-body preparation
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc test --release --locked --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') -p bonsai-broker --features json-candidate --lib json_candidate::ci_comparison -- --exact --ignored
          $result = Get-Content -Raw -LiteralPath (Join-Path $env:BONSAI_JSON_EVIDENCE 'comparison.json') | ConvertFrom-Json
          @(
            "Candidate path: $($result.candidate_path)",
            "Cold six-case median-time geometric mean: $($result.cold.original_six_geometric_mean_time_ratio)",
            "Cold six-case worst median-time ratio: $($result.cold.original_six_worst_case_time_ratio)",
            "Cold supplemental float-setting worst median-time ratio: $($result.cold.supplemental_worst_case_time_ratio)",
            "Cold screen qualifies: $($result.cold.qualifies)",
            "Reused six-case median-time geometric mean: $($result.reused.original_six_geometric_mean_time_ratio)",
            "Reused six-case worst median-time ratio: $($result.reused.original_six_worst_case_time_ratio)",
            "Reused supplemental float-setting worst median-time ratio: $($result.reused.supplemental_worst_case_time_ratio)",
            "Reused screen qualifies: $($result.reused.qualifies)",
            'Cold timing includes scratch setup and destruction. Reused timing excludes scratch creation and final destruction; both include immutable-input preparation and output destruction.',
            "Both screens qualify, including supplemental no-regression requirements: $($result.qualifies)",
            'Production remains on serde_json. This hosted CPU result does not establish inference TPS or Snapdragon behavior.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain comparison and host identities
        if: always() && env.BONSAI_JSON_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: json-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_JSON_EVIDENCE }}/*.json
          if-no-files-found: error
          compression-level: 1
