        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          CARGO_TARGET_DIR: ${{ env.TERNARY_TARGET_DIR }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $fixtures = Join-Path $env:GITHUB_WORKSPACE 'tools/ternary/tests/fixtures'
          $provenance = Get-Content -Raw -LiteralPath (Join-Path $fixtures 'provenance.json') | ConvertFrom-Json -DateKind String
          $fixture = Join-Path $fixtures 'ptq-reference.bin'
          if ((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -cne $provenance.fixtureSha256) { throw 'C++ reference fixture digest differs from provenance.' }
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-TernaryChecks-' + [guid]::NewGuid().ToString('N'))
