name: Foundation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  foundation:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Parse repository PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts, tests -Recurse -File | Where-Object Extension -in '.ps1','.psm1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors.Message -join [Environment]::NewLine) }
          }
      - name: Full foundation suite
        shell: pwsh
        run: ./tests/Test-Foundation.ps1 -Case All
      - name: Verify publisher ARM64 runtime and offline recheck
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime'
          ./scripts/Get-Engine.ps1 -DataDirectory $data
          ./scripts/Get-Engine.ps1 -DataDirectory $data -VerifyOnly
