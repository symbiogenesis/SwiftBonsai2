name: Foundation
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prism_benchmarks:
        description: Run the ported Prism benchmark workloads on Windows ARM64
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Checkout timestamps change on every runner. Reuse compiled Rust only when
  # Cargo verifies the source contents, while every check and test still runs.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
concurrency:
  group: foundation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  native-runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the pinned native Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Identify native Rust for the CPU reference runtime
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $identity = rustc +nightly-2026-10-22-aarch64-pc-windows-msvc -vV
          if ($identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
          "NATIVE_RUNTIME_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-NativeRuntime')" >> $env:GITHUB_ENV
      - name: Reuse locked native runtime dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ env.CARGO_TARGET_DIR }}
          key: native-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_RUNTIME_CACHE_HOST }}-nightly-2026-10-22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/prism-runtime/**', 'tools/prism/**', 'tools/gguf/**', 'tools/ternary/**', 'scripts/Bonsai.Rust.psm1', 'tests/Test-Rust.ps1', 'config/rust-packages.psd1', 'rust-toolchain.toml') }}-content-v1
          restore-keys: |
            native-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_RUNTIME_CACHE_HOST }}-nightly-2026-10-22-
      - name: Native CPU reference format, analyzers and complete correctness suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-NativeRuntimeChecks-' + [guid]::NewGuid().ToString('N'))
          "NATIVE_RUNTIME_CHECK_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          # The package registry audits all features; also exercise ordinary defaults below.
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Rust.ps1') -Package bonsai-prism-runtime -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory $evidence -FullTests -Build | ConvertTo-Json -Depth 8
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc test --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --test simd simd_default_selects_available_kernel_and_explicit_scalar_overrides -- --exact 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'default-backend.log')
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc build --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --no-default-features --lib
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc build --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --no-default-features --features experimental-neon --lib
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc clippy --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --no-default-features --all-targets -- -D warnings
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc test --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --no-default-features --test simd simd_ 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'scalar-without-neon.log')
          & (Join-Path $env:CARGO_TARGET_DIR 'release/bonsai-prism-runtime.exe') --help
          'Native Rust token-level CPU reference checks passed. Full-model parity, broker integration and device qualification remain pending.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain native runtime check evidence
        if: always() && env.NATIVE_RUNTIME_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-checks-${{ github.run_id }}
          path: ${{ env.NATIVE_RUNTIME_CHECK_EVIDENCE }}
          if-no-files-found: error
  runtime-scalar-fallback:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the pinned scalar fallback Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-x86_64-pc-windows-msvc
      - name: Identify native Rust and select the scalar fallback cache
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $identity = rustc +nightly-2026-10-22-x86_64-pc-windows-msvc -vV
          if ($identity -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Expected x86-64 scalar fallback build.' }
          "SCALAR_FALLBACK_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-ScalarFallback')" >> $env:GITHUB_ENV
      - name: Reuse locked scalar fallback dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ env.CARGO_TARGET_DIR }}
          key: scalar-fallback-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.SCALAR_FALLBACK_CACHE_HOST }}-nightly-2026-10-22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/prism-runtime/**', 'tools/prism/**', 'tools/gguf/**', 'tools/ternary/**', 'scripts/Bonsai.Rust.psm1', 'tests/Test-Rust.ps1', 'config/rust-packages.psd1', 'rust-toolchain.toml') }}-content-v1
          restore-keys: |
            scalar-fallback-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.SCALAR_FALLBACK_CACHE_HOST }}-nightly-2026-10-22-
      - name: Verify non-ARM fallback with default and explicit feature builds
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-ScalarFallbackChecks-' + [guid]::NewGuid().ToString('N'))
          "SCALAR_FALLBACK_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Rust.ps1') -Package bonsai-prism-runtime -Toolchain nightly-2026-10-22-x86_64-pc-windows-msvc -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory $evidence -Build | ConvertTo-Json -Depth 8
          cargo +nightly-2026-10-22-x86_64-pc-windows-msvc test --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --test simd simd_default_selects_available_kernel_and_explicit_scalar_overrides -- --exact 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'default-backend.log')
          cargo +nightly-2026-10-22-x86_64-pc-windows-msvc build --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --no-default-features --features experimental-neon --lib
          cargo +nightly-2026-10-22-x86_64-pc-windows-msvc test --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --all-features --test simd simd_ 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'non-arm-fallback.log')
          'Automatic and explicit NEON requests use the exact scalar fallback on x86-64; no target-device performance claim.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain scalar fallback evidence
        if: always() && env.SCALAR_FALLBACK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scalar-fallback-checks-${{ github.run_id }}
          path: ${{ env.SCALAR_FALLBACK_EVIDENCE }}
          if-no-files-found: error
  prism:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the pinned Linux ARM64 Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-unknown-linux-gnu
      - name: Identify native Rust for the storage policy and regression
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustc +nightly-2026-10-22 -vV
      - name: Select the ccache installation identity
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          "PRISM_PACKAGE_HOST=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_ENV
      - name: Reuse ccache installation packages for this runner image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SwiftBonsai-CcachePackages/*.deb
          # Dependencies already installed by the image must match on a hit.
          # Never restore these system packages across runner image versions.
          key: prism-ccache-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_PACKAGE_HOST }}
      - name: Install ccache and select the native compiler cache identity
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command ccache -CommandType Application -ErrorAction SilentlyContinue)) {
            $packageDirectory = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-CcachePackages'
            [void][IO.Directory]::CreateDirectory($packageDirectory)
            $packages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter '*.deb' -File | ForEach-Object { $_.FullName })
            if (-not $packages.Count) {
              sudo apt-get update -qq
              sudo apt-get --download-only -y --no-install-recommends -o "Dir::Cache::archives=$packageDirectory" install ccache
              $packages = @(Get-ChildItem -LiteralPath $packageDirectory -Filter '*.deb' -File | ForEach-Object { $_.FullName })
            }
            if (-not $packages.Count) { throw 'The ccache installation packages are missing.' }
            sudo dpkg --install @packages
          }
          $compiler = clang++ --version | Out-String
          $ccache = ccache --version | Out-String
          $identity = "$env:ImageOS-$env:ImageVersion-$compiler-$ccache"
          $digest = [Convert]::ToHexStringLower([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity)))
          "PRISM_CACHE_HOST=$digest" >> $env:GITHUB_ENV
      # Keep native and Rust caches separate: changing Cargo paths must not
      # invalidate every C++ object through the Actions cache path version.
      - name: Reuse pinned source downloads and compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/SwiftBonsai-PrismDownloads
            ${{ runner.temp }}/SwiftBonsai-PrismCcache
          key: prism-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-${{ hashFiles('tools/prism/**', 'scripts/Build-PrismEngine.ps1') }}
          restore-keys: |
            prism-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-
      - name: Reuse locked Prism Rust downloads and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/SwiftBonsai-PrismRustChecks
            ${{ runner.temp }}/SwiftBonsai-PrismRustBuild
          key: prism-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-nightly-2026-10-22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/prism/**', 'scripts/Build-PrismEngine.ps1', 'scripts/Bonsai.Rust.psm1', 'tests/Test-Rust.ps1', 'config/rust-packages.psd1', 'rust-toolchain.toml') }}-content-v1
          restore-keys: |
            prism-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-nightly-2026-10-22-
      - name: Check Rust and build the pinned engine with its Rust storage overlay
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          CC: clang
          CXX: clang++
          CCACHE_DIR: ${{ runner.temp }}/SwiftBonsai-PrismCcache
          CCACHE_MAXSIZE: 500M
          CCACHE_COMPILERCHECK: content
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Expected native ARM64 source build.' }
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'tools/prism/Cargo.toml'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismRustChecks'
          cargo +nightly-2026-10-22 fetch --manifest-path $manifest --locked
          $checks = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-PrismChecks-' + [guid]::NewGuid().ToString('N'))
          "PRISM_CHECK_EVIDENCE=$checks" >> $env:GITHUB_ENV
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Rust.ps1') -Package bonsai-prism -Toolchain nightly-2026-10-22 -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory (Join-Path $checks 'policy') -FullTests -Offline | ConvertTo-Json -Depth 8
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Common.psm1') -Force
          $lock = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tools/prism/source.lock.json') | ConvertFrom-Json
          $lane = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismDownloads'
          [IO.Directory]::CreateDirectory($lane) | Out-Null
          $archive = Join-Path $lane ("prism-source-$($lock.ArchiveSha256).zip")
          $null = Receive-LockedArtifact -Uri $lock.ArchiveUrl -Path $archive -Bytes $lock.ArchiveBytes -Sha256 $lock.ArchiveSha256 -TimeoutSeconds 600
          $rustBuild = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismRustBuild'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-PrismOverlay.ps1') -SourceArchive $archive -RustTargetDirectory $rustBuild
          $launcher = (Get-Command ccache -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $parallel = [Math]::Min(4, [Environment]::ProcessorCount)
          ccache --zero-stats
          $result = & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Build-PrismEngine.ps1') -SourceArchive $archive -BuildMode All -Generator Ninja -Parallel $parallel -CompilerLauncher $launcher -RustTargetDirectory $rustBuild
          $result | ConvertTo-Json -Depth 10
          "BONSAI_PRISM_EVIDENCE=$($result.EvidenceDirectory)" >> $env:GITHUB_ENV
          ctest --test-dir (Join-Path $result.EvidenceDirectory 'build-probe') --output-on-failure --timeout 60
          if ($LASTEXITCODE) { throw 'Native immutable B-sharing regression failed.' }
          $nativeLibraries = @(Get-ChildItem -LiteralPath (Join-Path $result.EvidenceDirectory 'build-probe') -Recurse -File | Where-Object { $_.Name -in @('libggml.a','libggml-cpu.a','libggml-base.a') })
          $env:BONSAI_PRISM_NATIVE_LIB_DIR = @($nativeLibraries.DirectoryName | Sort-Object -Unique) -join [IO.Path]::PathSeparator
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Rust.ps1') -Package bonsai-prism -Toolchain nightly-2026-10-22 -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory (Join-Path $checks 'native') -CheckProfile Native -Phase clippy,doc -Offline | ConvertTo-Json -Depth 8
          ccache --show-stats
          'Rust sharing policy and native regression passed; pinned engine compiled and linked to Rust. Model TPS/quality remains unqualified.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain source-build receipts and technical logs
        if: always() && env.BONSAI_PRISM_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-storage-overlay-${{ github.run_id }}
          path: |
            ${{ env.BONSAI_PRISM_EVIDENCE }}/build-receipt.json
            ${{ env.BONSAI_PRISM_EVIDENCE }}/command-*.log
            ${{ env.BONSAI_PRISM_EVIDENCE }}/build-probe/Testing/Temporary/LastTest.log
          if-no-files-found: error
      - name: Retain Prism Rust check evidence
        if: always() && env.PRISM_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-rust-checks-${{ github.run_id }}
          path: ${{ env.PRISM_CHECK_EVIDENCE }}
          if-no-files-found: error
  prism-upstream:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 330
    outputs:
      backend-tools-artifact-id: ${{ steps.backend-tools.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the pinned native Windows ARM64 Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Verify the native acceptance host and identify the Rust cache
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $IsWindows -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne [Runtime.InteropServices.Architecture]::Arm64) { throw 'Prism acceptance requires native Windows ARM64.' }
          $identity = rustc +nightly-2026-10-22-aarch64-pc-windows-msvc -vV
          if ($identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native Windows ARM64 Rust.' }
          $identity
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not [IO.File]::Exists($vswhere)) { throw 'Visual Studio Installer discovery is required for the ClangCL toolset.' }
          $visualStudio = (& $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath | Out-String).Trim()
          if (-not $visualStudio -or -not [IO.Directory]::Exists($visualStudio)) { throw 'Visual Studio 2026 with the LLVM Clang component is required for ARM64 ggml.' }
          "Native C++ acceptance uses Visual Studio 2026 ClangCL ARM64: $visualStudio"
          "PRISM_UPSTREAM_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          $visualStudioVersion = (& $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationVersion | Out-String).Trim()
          $msvcVersion = (Get-Content -LiteralPath (Join-Path $visualStudio 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          $llvmCompilers = @(Get-ChildItem -LiteralPath (Join-Path $visualStudio 'VC/Tools/Llvm') -Recurse -File -Filter clang-cl.exe)
          if (-not $llvmCompilers.Count) { throw 'The pinned Visual Studio LLVM compiler is missing.' }
          $llvmIdentity = @($llvmCompilers | Sort-Object FullName | ForEach-Object { "$($_.FullName):$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)" }) -join ';'
          $cmakeVersion = cmake --version | Out-String
          $nativeIdentity = "$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)-$visualStudioVersion-$msvcVersion-$llvmIdentity-$cmakeVersion"
          $nativeDigest = [Convert]::ToHexStringLower([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($nativeIdentity)))
          "PRISM_UPSTREAM_NATIVE_HOST=$nativeDigest" >> $env:GITHUB_ENV
      # Tests and evidence are always fresh. Verified source and native bridge
      # outputs can survive checkout timestamps in a stable external directory.
      - name: Reuse the pinned upstream archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SwiftBonsai-PrismUpstreamDownloads
          key: prism-upstream-download-v1-${{ runner.os }}-${{ hashFiles('tools/prism/source.lock.json') }}
      - name: Reuse shared-assertion Rust dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/SwiftBonsai-PrismUpstreamRust
          key: prism-upstream-rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_UPSTREAM_CACHE_HOST }}-nightly-2026-10-22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/prism/upstream/**', 'src/prism-runtime/**', 'tools/ternary/**', 'tools/gguf/**') }}-content-v1
          restore-keys: |
            prism-upstream-rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_UPSTREAM_CACHE_HOST }}-nightly-2026-10-22-
      - name: Reuse exact pinned upstream native builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SwiftBonsai-PrismUpstreamNative
          # Orchestration changes can reuse the same native source/compiler tree.
          # Never restore across source pins, adapter code or compiler identities;
          # source verification and CMake still run before every correctness test.
          key: prism-upstream-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_UPSTREAM_NATIVE_HOST }}-vs18-clangcl-arm64-${{ hashFiles('tools/prism/source.lock.json', 'tools/prism/upstream/*.lock.json', 'tools/prism/upstream/**/CMakeLists.txt', 'tools/prism/upstream/**/*.cmake', 'tools/prism/upstream/**/*.c', 'tools/prism/upstream/**/*.cpp', 'tools/prism/upstream/**/*.h', 'tools/prism/upstream/**/*.hpp', 'tools/prism/upstream/**/*.inc') }}-${{ hashFiles('tests/Test-PrismUpstream.ps1', 'scripts/Bonsai.PrismNativeCache.psm1') }}
          restore-keys: |
            prism-upstream-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_UPSTREAM_NATIVE_HOST }}-vs18-clangcl-arm64-${{ hashFiles('tools/prism/source.lock.json', 'tools/prism/upstream/*.lock.json', 'tools/prism/upstream/**/CMakeLists.txt', 'tools/prism/upstream/**/*.cmake', 'tools/prism/upstream/**/*.c', 'tools/prism/upstream/**/*.cpp', 'tools/prism/upstream/**/*.h', 'tools/prism/upstream/**/*.hpp', 'tools/prism/upstream/**/*.inc') }}-
      - name: Run safe Rust conformance on upstream and Rust
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-PrismUpstream-' + [guid]::NewGuid().ToString('N'))
          "PRISM_UPSTREAM_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Common.psm1')
          $lock = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tools/prism/source.lock.json') -Raw | ConvertFrom-Json
          $downloads = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismUpstreamDownloads'
          [void][IO.Directory]::CreateDirectory($downloads)
          $archive = Join-Path $downloads ("prism-$($lock.ArchiveSha256).zip")
          $null = Receive-LockedArtifact -Uri $lock.ArchiveUrl -Path $archive -Bytes $lock.ArchiveBytes -Sha256 $lock.ArchiveSha256 -TimeoutSeconds 600
          cargo +nightly-2026-10-22-aarch64-pc-windows-msvc fetch --locked --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml')
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-PrismNativeCache.ps1')
          foreach ($case in @('Scheduling', 'Identity', 'ProcessFailure')) {
            & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-PrismRunner.ps1') -Case $case
          }
          foreach ($case in @('Catalog', 'Ratchet', 'Evidence')) {
            & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-PrismBaseline.ps1') -Case $case
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-PrismUpstream.ps1') -SourceArchive $archive -EvidenceDirectory $evidence -TargetDirectory (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismUpstreamRust') -NativeBuildDirectory (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismUpstreamNative') -Generator 'Visual Studio 18 2026' -NativePlatform ARM64 -Toolchain nightly-2026-10-22-aarch64-pc-windows-msvc -Parallel 4 -CaseParallel 2 -DeferBackend | ConvertTo-Json -Depth 12
      - name: Publish revision-bound native backend shard tools
        id: backend-tools
        if: always() && !cancelled() && env.PRISM_UPSTREAM_EVIDENCE != ''
