name: Foundation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Checkout timestamps change on every runner. Reuse compiled Rust only when
  # Cargo verifies the source contents, while every check and test still runs.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
concurrency:
  group: foundation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  broker:
    name: broker / ${{ matrix.lane }}
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      # Keep each package's feature checks isolated while compiling independent
      # package selections concurrently. Every lane must still pass the gate.
      fail-fast: false
      matrix:
        lane: [core, maintenance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse the pinned native Rust compiler
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Identify the native Rust toolchain in CI
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $identity = rustc +nightly-2026-10-22-aarch64-pc-windows-msvc -vV
          if ($LASTEXITCODE -or $identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
          $identity
      - name: Select external Cargo cache paths
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $target = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Broker'
          foreach ($path in @($cargoHome, $target)) {
            if (-not [IO.Path]::IsPathFullyQualified($path) -or $path -match '%[^%]+%') { throw 'Expected expanded absolute Cargo paths.' }
          }
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
          # Runner-provided process variables are not automatically env-context
          # values in workflow expressions; export the cache identity explicitly.
          $hostIdentity = "$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)"
          "BROKER_CACHE_HOST=$hostIdentity" >> $env:GITHUB_ENV
      - name: Reuse locked Cargo downloads and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache downloads, never credentials or the full Cargo home. The hosted
          # runner temp path is stable within its isolated job, unlike a new GUID.
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: broker-v4-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ env.BROKER_CACHE_HOST }}-rustnightly-2026-10-22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/broker/Cargo.toml', 'src/cpu-policy/Cargo.toml', 'src/artifacts/Cargo.toml', 'src/windows-*/Cargo.toml', 'tools/bonsai/Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/broker/**/*.rs', 'src/cpu-policy/**', 'src/artifacts/**', 'src/windows-*/**', 'tools/bonsai/**', 'config/**/*.json', 'tests/fixtures/lora-qualification-v1.json', 'scripts/Bonsai.Rust.psm1', 'tests/Test-Rust.ps1', 'config/rust-packages.psd1') }}-content-v1
          restore-keys: |
            broker-v4-${{ matrix.lane }}-${{ runner.os }}-${{ runner.arch }}-${{ env.BROKER_CACHE_HOST }}-rustnightly-2026-10-22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/broker/Cargo.toml', 'src/cpu-policy/Cargo.toml', 'src/artifacts/Cargo.toml', 'src/windows-*/Cargo.toml', 'tools/bonsai/Cargo.toml', 'rust-toolchain.toml') }}-
            broker-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.BROKER_CACHE_HOST }}-rustnightly-2026-10-22-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/broker/Cargo.toml', 'src/cpu-policy/Cargo.toml', 'src/artifacts/Cargo.toml', 'src/windows-*/Cargo.toml', 'tools/bonsai/Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Broker format, analyzer and full correctness suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          BROKER_LANE: ${{ matrix.lane }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-BrokerChecks-' + [guid]::NewGuid().ToString('N'))
          "BROKER_CHECK_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Rust.psm1')
          # Derive both selections from the registry so future Broker packages
          # remain covered without another hard-coded package list.
          $packages = @(Get-BonsaiRustPackage -Group Broker | Where-Object {
            if ($env:BROKER_LANE -ceq 'core') { $_.Name -ceq 'bonsai-broker' }
            else { $_.Name -cne 'bonsai-broker' }
          } | ForEach-Object { $_.Name })
          if (-not $packages.Count) { throw 'The Broker lane must select registered packages.' }
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Rust.ps1') -Group Broker -Package $packages -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory $evidence -FullTests -Build | ConvertTo-Json -Depth 8
      - name: Retain broker and packaged tool check evidence
        if: always() && env.BROKER_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker-checks-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ env.BROKER_CHECK_EVIDENCE }}
          if-no-files-found: error
      - name: Package the native Windows ARM64 maintenance CLI
        if: matrix.lane == 'maintenance'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonsai-tools-windows-arm64-${{ github.sha }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/bonsai-tools.exe
          if-no-files-found: error
  standards:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the C# analyzer SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'
      - name: Reuse the pinned PowerShell analyzer
        id: analyzer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SwiftBonsai-Standards-Tools
          key: psscriptanalyzer-v1-${{ runner.os }}-${{ runner.arch }}-1.25.0
      - name: Save the pinned PowerShell analyzer on a cache miss
        if: steps.analyzer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Path (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Standards-Tools') -Force
      - name: Enforce PowerShell and C# standards
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($PSVersionTable.PSVersion -lt [version]'7.6' -or $PSVersionTable.PSVersion.PreReleaseLabel) {
            throw 'Foundation requires stable PowerShell 7.6 or later on the runner.'
          }
          $tooling = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Standards-Tools'
          $analyzer = Join-Path $tooling 'PSScriptAnalyzer/1.25.0/PSScriptAnalyzer.psd1'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Standards.ps1') -AnalyzerModulePath $analyzer
  # Preserve the required check name and reject failure or skipping in any lane.
  foundation:
    if: always() && github.ref == 'refs/heads/main'
    needs: [broker, standards, foundation-tests, lifecycle, release-integration]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Require every Foundation test group
        shell: bash
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          if ! jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"; then
            echo "$JOB_RESULTS"
            exit 1
          fi
  lifecycle:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse maintenance tools and the shared lifecycle probe build cache
        uses: ./.github/actions/bonsai-tools
        with:
          require-compiler: 'true'
      - name: Windows owned process lifecycle and resource limits
        shell: pwsh
        run: |
          ./tests/Test-ProcessLifecycle.ps1 -Case Lifetime -TargetDirectory $env:BONSAI_TOOLS_TARGET
          ./tests/Test-ProcessLifecycle.ps1 -Case Limits -TargetDirectory $env:BONSAI_TOOLS_TARGET
          ./tests/Test-ProcessLifecycle.ps1 -Case LaunchContract -TargetDirectory $env:BONSAI_TOOLS_TARGET
      - name: Packaged supervisor caller death and failure contracts
        shell: pwsh
        run: |
          foreach ($case in @('ParentDeath', 'Timeout', 'ExitCode')) {
            ./tests/Test-CompletionSupervision.ps1 -Case $case -ToolPath $env:BONSAI_TOOLS_PATH
          }
  foundation-tests:
    name: scripts / ${{ matrix.lane }}
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [foundation, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Foundation test SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'
      - name: Build packaged maintenance tools once for script checks
        uses: ./.github/actions/bonsai-tools
      - name: Full foundation suite
        if: matrix.lane == 'foundation'
        shell: pwsh
        run: ./tests/Test-Foundation.ps1 -Case All
      - name: Pinned inference binary contracts
        if: matrix.lane == 'foundation'
        shell: pwsh
        run: |
          ./tests/Test-Inference.ps1 -Case All
      - name: Released GGUF command integration
        if: matrix.lane == 'foundation'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Inference'
          $inference = & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Get-Inference.ps1') -DataDirectory $data
          $env:BONSAI_GGUF_TOOL = $inference.Gguf
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Gguf.ps1') -Case All
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Pq2Census.ps1')
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-Ptq1Export.ps1') -Case All
      - name: Native tool invocation contracts
        if: matrix.lane == 'native'
        shell: pwsh
        run: |
          foreach ($case in @('Capture','Failure','Environment','Timeout','Drain')) {
            ./tests/Test-NativeProcess.ps1 -Case $case
          }
      - name: Engine build scheduling correctness
        if: matrix.lane == 'native'
        shell: pwsh
        run: ./tests/Test-EngineBuild.ps1 -Case Parallelism
      - name: Rust check feature isolation and local-suite policy
        if: matrix.lane == 'foundation'
        shell: pwsh
        run: ./tests/Test-RustTooling.ps1
      - name: Development credential creation and path policy
        if: matrix.lane == 'foundation'
        shell: pwsh
        run: |
          ./tests/Test-DevelopmentKeys.ps1 -Case Creation
          ./tests/Test-DevelopmentKeys.ps1 -Case Paths
      - name: CPU admission diagnostics without model launch
        if: matrix.lane == 'foundation'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $result = ./scripts/Invoke-CpuCheck.ps1 -DataDirectory (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime') -CheckOnly
          if ($result.ModelProcessStarted -or $result.AvailablePhysicalBytesAtAdmission -le 0) { throw 'Invalid admission-only result.' }
          $result | ConvertTo-Json
      - name: Mandatory standard LoRA scorer and capture argument contracts
        if: matrix.lane == 'native'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraQualification.ps1') -Case Scoring
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraQualification.ps1') -Case Rejection
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraQualification.ps1') -Case Json
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraQualification.ps1') -Case Compatibility
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraEvaluation.ps1') -Case All
          $plan = & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-LoraQualification.ps1') -DataDirectory (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime') -PlanOnly
          if ($plan.ModelProcessStarted -or $plan.PairedSamples -ne 24 -or $plan.ZeroScaleSamples -ne 4) { throw 'Invalid nonlaunching LoRA qualification plan.' }
          $plan | ConvertTo-Json
  release-integration:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse packaged maintenance tools
        uses: ./.github/actions/bonsai-tools
      - name: Swift assessment policy and pinned ARM64 runtime
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          ./tests/Test-CpuCheckPolicy.ps1 -Case Profiles
          ./tests/Test-CpuCheckPolicy.ps1 -Case Artifacts
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime'
          $lockPath = Join-Path $env:GITHUB_WORKSPACE 'config/swift-assessment.lock.json'
          ./scripts/Get-Engine.ps1 -DataDirectory $data -LockPath $lockPath
          ./scripts/Get-Adapter.ps1 -DataDirectory $data
          ./scripts/Get-Adapter.ps1 -DataDirectory $data -VerifyOnly
          $result = ./scripts/Invoke-CpuCheck.ps1 -DataDirectory $data -ProfileName swift-pq2-assessment -CheckOnly
          if ($result.ModelProcessStarted -or $result.RequiredAvailableBytes -ne 16GB) { throw 'Invalid Swift admission-only result.' }
          $result | ConvertTo-Json
          $adapterCheck = ./scripts/Invoke-CpuCheck.ps1 -DataDirectory $data -ProfileName swift-pq2-assessment -UseAbliterateLora -CheckOnly
          if ($adapterCheck.ModelProcessStarted -or -not $adapterCheck.AdapterRequested -or $adapterCheck.EstimatedAdapterBytes -ne 9682464) { throw 'Invalid explicit adapter admission-only result.' }
          $adapterCheck | ConvertTo-Json
          $ptqCheck = ./scripts/Invoke-CpuCheck.ps1 -DataDirectory $data -ProfileName swift-pq2-assessment -UseRepackedPtq1 -CheckOnly
          if ($ptqCheck.ModelProcessStarted -or $ptqCheck.EstimatedWeightBytes -ne 5946648928 -or $ptqCheck.WeightRepresentation -cne 'current-repacked-PTQ1_0') { throw 'Invalid derived PTQ1 admission-only result.' }
      - name: Verify publisher ARM64 runtime and planned server switches
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime'
          ./scripts/Get-Engine.ps1 -DataDirectory $data
          $plan = ./scripts/Get-ServerPlan.ps1 -DataDirectory $data -VerifyRuntime
          if ($plan.LaunchEnabled -or $plan.ModelProcessStarted -or
              $plan.RuntimeHelpVerification -notlike 'all-planned-switches-advertised*' -or
              $plan.ArtifactVerification -notlike '*model-not-checked') { throw 'Invalid runtime-only preflight result.' }
          $plan | Select-Object Status, ArtifactVerification, RuntimeHelpVerification | ConvertTo-Json
