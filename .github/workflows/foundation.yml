name: Foundation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  native-runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native Rust for the CPU reference runtime
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.99.1-aarch64-pc-windows-msvc --profile minimal --component rustfmt,clippy --no-self-update
          $identity = rustc +1.99.1-aarch64-pc-windows-msvc -vV
          if ($identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
          "NATIVE_RUNTIME_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-NativeRuntime')" >> $env:GITHUB_ENV
      - name: Reuse locked native runtime dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ env.CARGO_TARGET_DIR }}
          key: native-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_RUNTIME_CACHE_HOST }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/prism-runtime/**', 'tools/prism/**', 'tools/gguf/**', 'tools/ternary/**', 'scripts/Bonsai.Rust.psm1', 'scripts/Test-Rust.ps1', 'config/rust-packages.psd1', 'rust-toolchain.toml') }}
          restore-keys: |
            native-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_RUNTIME_CACHE_HOST }}-1.99.1-
      - name: Native CPU reference format, analyzers and complete correctness suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-NativeRuntimeChecks-' + [guid]::NewGuid().ToString('N'))
          "NATIVE_RUNTIME_CHECK_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Rust.ps1') -Package bonsai-prism-runtime -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory $evidence -FullTests -Build | ConvertTo-Json -Depth 8
          cargo +1.99.1-aarch64-pc-windows-msvc build --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-prism-runtime --locked --offline --release --no-default-features --lib
          & (Join-Path $env:CARGO_TARGET_DIR 'release/bonsai-prism-runtime.exe') --help
          'Native Rust token-level CPU reference checks passed. Full-model parity, broker integration and device qualification remain pending.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain native runtime check evidence
        if: always() && env.NATIVE_RUNTIME_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-checks-${{ github.run_id }}
          path: ${{ env.NATIVE_RUNTIME_CHECK_EVIDENCE }}
          if-no-files-found: error
  prism:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native Rust for the storage policy and regression
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustc +1.99.1 -vV
      - name: Select the native compiler cache identity
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command ccache -CommandType Application -ErrorAction SilentlyContinue)) {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ccache
          }
          $compiler = clang++ --version | Out-String
          $ccache = ccache --version | Out-String
          $identity = "$env:ImageOS-$env:ImageVersion-$compiler-$ccache"
          $digest = [Convert]::ToHexStringLower([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity)))
          "PRISM_CACHE_HOST=$digest" >> $env:GITHUB_ENV
      # Keep native and Rust caches separate: changing Cargo paths must not
      # invalidate every C++ object through the Actions cache path version.
      - name: Reuse pinned source downloads and compiler objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/SwiftBonsai-PrismDownloads
            ${{ runner.temp }}/SwiftBonsai-PrismCcache
          key: prism-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-${{ hashFiles('tools/prism/**', 'scripts/Build-PrismEngine.ps1') }}
          restore-keys: |
            prism-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-
      - name: Reuse locked Prism Rust downloads and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/SwiftBonsai-PrismRustChecks
            ${{ runner.temp }}/SwiftBonsai-PrismRustBuild
          key: prism-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/prism/**', 'scripts/Build-PrismEngine.ps1', 'scripts/Bonsai.Rust.psm1', 'scripts/Test-Rust.ps1', 'config/rust-packages.psd1', 'rust-toolchain.toml') }}
          restore-keys: |
            prism-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PRISM_CACHE_HOST }}-1.99.1-
      - name: Check Rust and build the pinned engine with its Rust storage overlay
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          CC: clang
          CXX: clang++
          CCACHE_DIR: ${{ runner.temp }}/SwiftBonsai-PrismCcache
          CCACHE_MAXSIZE: 500M
          CCACHE_COMPILERCHECK: content
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Expected native ARM64 source build.' }
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'tools/prism/Cargo.toml'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismRustChecks'
          cargo +1.99.1 fetch --manifest-path $manifest --locked
          $checks = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-PrismChecks-' + [guid]::NewGuid().ToString('N'))
          "PRISM_CHECK_EVIDENCE=$checks" >> $env:GITHUB_ENV
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Rust.ps1') -Package bonsai-prism -Toolchain 1.99.1 -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory (Join-Path $checks 'policy') -FullTests -Offline | ConvertTo-Json -Depth 8
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/Bonsai.Common.psm1') -Force
          $lock = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tools/prism/source.lock.json') | ConvertFrom-Json
          $lane = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismDownloads'
          [IO.Directory]::CreateDirectory($lane) | Out-Null
          $archive = Join-Path $lane ("prism-source-$($lock.ArchiveSha256).zip")
          $null = Receive-LockedArtifact -Uri $lock.ArchiveUrl -Path $archive -Bytes $lock.ArchiveBytes -Sha256 $lock.ArchiveSha256 -TimeoutSeconds 600
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-PrismOverlay.ps1') -SourceArchive $archive
          $launcher = (Get-Command ccache -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $parallel = [Math]::Min(4, [Environment]::ProcessorCount)
          ccache --zero-stats
          $rustBuild = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-PrismRustBuild'
          $result = & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Build-PrismEngine.ps1') -SourceArchive $archive -BuildMode All -Generator Ninja -Parallel $parallel -CompilerLauncher $launcher -RustTargetDirectory $rustBuild
          $result | ConvertTo-Json -Depth 10
          "BONSAI_PRISM_EVIDENCE=$($result.EvidenceDirectory)" >> $env:GITHUB_ENV
          ctest --test-dir (Join-Path $result.EvidenceDirectory 'build-probe') --output-on-failure --timeout 60
          if ($LASTEXITCODE) { throw 'Native immutable B-sharing regression failed.' }
          $nativeLibraries = @(Get-ChildItem -LiteralPath (Join-Path $result.EvidenceDirectory 'build-probe') -Recurse -File | Where-Object { $_.Name -in @('libggml.a','libggml-cpu.a','libggml-base.a') })
          $env:BONSAI_PRISM_NATIVE_LIB_DIR = @($nativeLibraries.DirectoryName | Sort-Object -Unique) -join [IO.Path]::PathSeparator
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Rust.ps1') -Package bonsai-prism -Toolchain 1.99.1 -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory (Join-Path $checks 'native') -CheckProfile Native -Phase clippy,doc -Offline | ConvertTo-Json -Depth 8
          ccache --show-stats
          'Rust sharing policy and native regression passed; pinned engine compiled and linked to Rust. Model TPS/quality remains unqualified.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain source-build receipts and technical logs
        if: always() && env.BONSAI_PRISM_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-storage-overlay-${{ github.run_id }}
          path: |
            ${{ env.BONSAI_PRISM_EVIDENCE }}/build-receipt.json
            ${{ env.BONSAI_PRISM_EVIDENCE }}/command-*.log
            ${{ env.BONSAI_PRISM_EVIDENCE }}/build-probe/Testing/Temporary/LastTest.log
          if-no-files-found: error
      - name: Retain Prism Rust check evidence
        if: always() && env.PRISM_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-rust-checks-${{ github.run_id }}
          path: ${{ env.PRISM_CHECK_EVIDENCE }}
          if-no-files-found: error
  ternary:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install explicit native Rust toolchain
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.99.1-aarch64-pc-windows-msvc --profile minimal --component rustfmt,clippy --no-self-update
          $identity = rustc +1.99.1-aarch64-pc-windows-msvc -vV
          if ($identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
          $identity
          "TERNARY_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "TERNARY_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-TernaryRust')" >> $env:GITHUB_ENV
      - name: Reuse Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ env.TERNARY_TARGET_DIR }}
          key: ternary-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.TERNARY_CACHE_HOST }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/ternary/**', 'scripts/Bonsai.Rust.psm1', 'scripts/Test-Rust.ps1', 'config/rust-packages.psd1', 'rust-toolchain.toml') }}
          restore-keys: |
            ternary-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.TERNARY_CACHE_HOST }}-1.99.1-
      - name: PQ2 and PTQ codecs, FP16 reference parity and Rust analyzers
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          CARGO_TARGET_DIR: ${{ env.TERNARY_TARGET_DIR }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $fixtures = Join-Path $env:GITHUB_WORKSPACE 'tools/ternary/tests/fixtures'
          $provenance = Get-Content -Raw -LiteralPath (Join-Path $fixtures 'provenance.json') | ConvertFrom-Json -DateKind String
          $fixture = Join-Path $fixtures 'ptq-reference.bin'
          if ((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -cne $provenance.fixtureSha256) { throw 'C++ reference fixture digest differs from provenance.' }
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-TernaryChecks-' + [guid]::NewGuid().ToString('N'))
          "TERNARY_CHECK_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          # Workspace resolution needs the shared index even for this package
          # with no dependencies. Permit initial locked index resolution while
          # compiling and testing only ternary; subsequent runs reuse the cache.
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Rust.ps1') -Package bonsai-ternary -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory $evidence -FullTests | ConvertTo-Json -Depth 8
          'Shared PQ2/PTQ codecs and FP16 conversion passed correctness checks and retained C++ reference parity.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain ternary Rust check evidence
        if: always() && env.TERNARY_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ternary-checks-${{ github.run_id }}
          path: ${{ env.TERNARY_CHECK_EVIDENCE }}
          if-no-files-found: error
      - name: Kill the bounded codec mutation catalog
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-Mutations-' + [guid]::NewGuid().ToString('N'))
          "MUTATION_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Mutations.ps1') -EvidenceDirectory $evidence
          'All six compile-valid codec mutants were killed by their exact assertion tests; this is a bounded catalog, not a whole-program mutation score.' >> $env:GITHUB_STEP_SUMMARY
      - name: Retain mutation results and compiler/test logs
        if: ${{ always() && env.MUTATION_EVIDENCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codec-mutations
          path: |
            ${{ env.MUTATION_EVIDENCE }}/mutation-results.json
            ${{ env.MUTATION_EVIDENCE }}/*.log
          if-no-files-found: error
  broker:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install explicit native Rust toolchain in CI
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.99.1-aarch64-pc-windows-msvc --profile minimal --component rustfmt,clippy --no-self-update
          if ($LASTEXITCODE) { throw 'Rust toolchain installation failed.' }
          $identity = rustc +1.99.1-aarch64-pc-windows-msvc -vV
          if ($LASTEXITCODE -or $identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
          $identity
      - name: Select external Cargo cache paths
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $target = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Broker'
          foreach ($path in @($cargoHome, $target)) {
            if (-not [IO.Path]::IsPathFullyQualified($path) -or $path -match '%[^%]+%') { throw 'Expected expanded absolute Cargo paths.' }
          }
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
          # Runner-provided process variables are not automatically env-context
          # values in workflow expressions; export the cache identity explicitly.
          $hostIdentity = "$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)"
          "BROKER_CACHE_HOST=$hostIdentity" >> $env:GITHUB_ENV
      - name: Reuse locked Cargo downloads and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache downloads, never credentials or the full Cargo home. The hosted
          # runner temp path is stable within its isolated job, unlike a new GUID.
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: broker-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.BROKER_CACHE_HOST }}-rust1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/broker/Cargo.toml', 'src/windows-*/Cargo.toml', 'tools/bonsai/Cargo.toml', 'rust-toolchain.toml') }}-${{ hashFiles('src/broker/**/*.rs', 'src/windows-*/**', 'tools/bonsai/**', 'scripts/Bonsai.Rust.psm1', 'scripts/Test-Rust.ps1', 'config/rust-packages.psd1') }}
          restore-keys: |
            broker-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.BROKER_CACHE_HOST }}-rust1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'src/broker/Cargo.toml', 'src/windows-*/Cargo.toml', 'tools/bonsai/Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Broker format, analyzer and full correctness suite
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-BrokerChecks-' + [guid]::NewGuid().ToString('N'))
          "BROKER_CHECK_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Rust.ps1') -Group Broker -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory $evidence -FullTests -Build | ConvertTo-Json -Depth 8
      - name: Retain broker and packaged tool check evidence
        if: always() && env.BROKER_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker-checks-${{ github.run_id }}
          path: ${{ env.BROKER_CHECK_EVIDENCE }}
          if-no-files-found: error
      - name: Package the native Windows ARM64 maintenance CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonsai-tools-windows-arm64-${{ github.sha }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/bonsai-tools.exe
          if-no-files-found: error
  standards:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the C# analyzer SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'
      - name: Reuse the pinned PowerShell analyzer
        id: analyzer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SwiftBonsai-Standards-Tools
          key: psscriptanalyzer-v1-${{ runner.os }}-${{ runner.arch }}-1.25.0
      - name: Save the pinned PowerShell analyzer on a cache miss
        if: steps.analyzer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Path (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Standards-Tools') -Force
      - name: Enforce PowerShell and C# standards
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($PSVersionTable.PSVersion -lt [version]'7.6' -or $PSVersionTable.PSVersion.PreReleaseLabel) {
            throw 'Foundation requires stable PowerShell 7.6 or later on the runner.'
          }
          $tooling = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Standards-Tools'
          $analyzer = Join-Path $tooling 'PSScriptAnalyzer/1.25.0/PSScriptAnalyzer.psd1'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Standards.ps1') -AnalyzerModulePath $analyzer
  # Preserve the required check name and reject failure or skipping in any lane.
  foundation:
    if: always() && github.ref == 'refs/heads/main'
    needs: [native-runtime, prism, ternary, broker, standards, foundation-tests, lifecycle, gguf, runtime-policy]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Require every Foundation test group
        shell: bash
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          if ! jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"; then
            echo "$JOB_RESULTS"
            exit 1
          fi
  lifecycle:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build packaged maintenance tools once for lifecycle checks
        uses: ./.github/actions/bonsai-tools
      - name: Windows owned process lifecycle and resource limits
        shell: pwsh
        run: |
          ./tests/Test-ProcessLifecycle.ps1 -Case Lifetime
          ./tests/Test-ProcessLifecycle.ps1 -Case Limits
          ./tests/Test-ProcessLifecycle.ps1 -Case LaunchContract
      - name: Packaged supervisor caller death and failure contracts
        shell: pwsh
        run: |
          foreach ($case in @('ParentDeath', 'Timeout', 'ExitCode')) {
            ./tests/Test-CompletionSupervision.ps1 -Case $case -ToolPath $env:BONSAI_TOOLS_PATH
          }
  foundation-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Foundation test SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'
      - name: Build packaged maintenance tools once for script checks
        uses: ./.github/actions/bonsai-tools
      - name: Full foundation suite
        shell: pwsh
        run: ./tests/Test-Foundation.ps1 -Case All
      - name: Native tool invocation contracts
        shell: pwsh
        run: |
          foreach ($case in @('Capture','Failure','Environment','Timeout','Drain')) {
            ./tests/Test-NativeProcess.ps1 -Case $case
          }
      - name: Engine build scheduling correctness
        shell: pwsh
        run: ./tests/Test-EngineBuild.ps1 -Case Parallelism
      - name: Rust check feature isolation and local-suite policy
        shell: pwsh
        run: ./tests/Test-RustTooling.ps1
      - name: Development credential creation and path policy
        shell: pwsh
        run: |
          ./tests/Test-DevelopmentKeys.ps1 -Case Creation
          ./tests/Test-DevelopmentKeys.ps1 -Case Paths
      - name: CPU admission diagnostics without model launch
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $result = ./scripts/Invoke-CpuCheck.ps1 -DataDirectory (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime') -CheckOnly
          if ($result.ModelProcessStarted -or $result.AvailablePhysicalBytesAtAdmission -le 0) { throw 'Invalid admission-only result.' }
          $result | ConvertTo-Json
      - name: Mandatory standard LoRA scorer and native capture parser correctness
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraQualification.ps1') -Case Scoring
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraQualification.ps1') -Case Rejection
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraQualification.ps1') -Case Json
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraQualification.ps1') -Case Compatibility
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-LoraEvaluation.ps1') -Case All
          $plan = & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-LoraQualification.ps1') -DataDirectory (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime') -PlanOnly
          if ($plan.ModelProcessStarted -or $plan.PairedSamples -ne 24 -or $plan.ZeroScaleSamples -ne 4) { throw 'Invalid nonlaunching LoRA qualification plan.' }
          $plan | ConvertTo-Json
  gguf:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install explicit native Rust and select the GGUF cache
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.99.1-aarch64-pc-windows-msvc --profile minimal --component rustfmt,clippy --no-self-update
          $identity = rustc +1.99.1-aarch64-pc-windows-msvc -vV
          if ($identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
          "GGUF_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'SwiftBonsai-GgufRust')" >> $env:GITHUB_ENV
      - name: Reuse locked GGUF downloads and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: gguf-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GGUF_CACHE_HOST }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'tools/gguf/**', 'tools/ternary/**', 'scripts/Bonsai.Rust.psm1', 'scripts/Test-Rust.ps1', 'config/rust-packages.psd1', 'rust-toolchain.toml') }}
          restore-keys: |
            gguf-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GGUF_CACHE_HOST }}-1.99.1-
      - name: Build and check the Rust GGUF CLI
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-GgufChecks-' + [guid]::NewGuid().ToString('N'))
          "GGUF_CHECK_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-Rust.ps1') -Package bonsai-gguf -TargetDirectory $env:CARGO_TARGET_DIR -EvidenceDirectory $evidence -FullTests -Build | ConvertTo-Json -Depth 8
          cargo +1.99.1-aarch64-pc-windows-msvc build --manifest-path (Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml') --package bonsai-gguf --locked --offline --release --no-default-features --lib
          "BONSAI_GGUF_TOOL=$(Join-Path $env:CARGO_TARGET_DIR 'release/bonsai-gguf.exe')" >> $env:GITHUB_ENV
      - name: Retain GGUF Rust check evidence
        if: always() && env.GGUF_CHECK_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gguf-checks-${{ github.run_id }}
          path: ${{ env.GGUF_CHECK_EVIDENCE }}
          if-no-files-found: error
      - name: Full GGUF inspector suite
        shell: pwsh
        run: ./tests/Test-Gguf.ps1 -Case All
      - name: Pinned Prism PQ2 census regression
        shell: pwsh
        run: ./tests/Test-Pq2Census.ps1
      - name: Exact PQ2 to native PTQ1 block packing
        shell: pwsh
        run: ./tests/Test-Pq2Ptq1Codec.ps1
      - name: Streamed Rust PTQ1 weight export
        shell: pwsh
        run: ./tests/Test-Ptq1Export.ps1 -Case All
  runtime-policy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build packaged maintenance tools once for policy checks
        uses: ./.github/actions/bonsai-tools
      - name: Swift assessment policy and pinned ARM64 runtime
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          ./tests/Test-CpuCheckPolicy.ps1 -Case Profiles
          ./tests/Test-CpuCheckPolicy.ps1 -Case Artifacts
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime'
          $lockPath = Join-Path $env:GITHUB_WORKSPACE 'config/swift-assessment.lock.json'
          ./scripts/Get-Engine.ps1 -DataDirectory $data -LockPath $lockPath
          ./tests/Test-PrismCodec.ps1 -DataDirectory $data
          ./scripts/Get-Adapter.ps1 -DataDirectory $data
          ./scripts/Get-Adapter.ps1 -DataDirectory $data -VerifyOnly
          $result = ./scripts/Invoke-CpuCheck.ps1 -DataDirectory $data -Profile swift-pq2-assessment -CheckOnly
          if ($result.ModelProcessStarted -or $result.RequiredAvailableBytes -ne 16GB) { throw 'Invalid Swift admission-only result.' }
          $result | ConvertTo-Json
          $adapterCheck = ./scripts/Invoke-CpuCheck.ps1 -DataDirectory $data -Profile swift-pq2-assessment -UseAbliterateLora -CheckOnly
          if ($adapterCheck.ModelProcessStarted -or -not $adapterCheck.AdapterRequested -or $adapterCheck.EstimatedAdapterBytes -ne 9682464) { throw 'Invalid explicit adapter admission-only result.' }
          $adapterCheck | ConvertTo-Json
          $ptqCheck = ./scripts/Invoke-CpuCheck.ps1 -DataDirectory $data -Profile swift-pq2-assessment -UseRepackedPtq1 -CheckOnly
          if ($ptqCheck.ModelProcessStarted -or $ptqCheck.EstimatedWeightBytes -ne 5946648928 -or $ptqCheck.WeightRepresentation -cne 'current-repacked-PTQ1_0') { throw 'Invalid derived PTQ1 admission-only result.' }
      - name: Verify publisher ARM64 runtime and planned server switches
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Runtime'
          ./scripts/Get-Engine.ps1 -DataDirectory $data
          $plan = ./scripts/Get-ServerPlan.ps1 -DataDirectory $data -VerifyRuntime
          if ($plan.LaunchEnabled -or $plan.ModelProcessStarted -or
              $plan.RuntimeHelpVerification -notlike 'all-planned-switches-advertised*' -or
              $plan.ArtifactVerification -notlike '*model-not-checked') { throw 'Invalid runtime-only preflight result.' }
          $plan | Select-Object Status, ArtifactVerification, RuntimeHelpVerification | ConvertTo-Json
