name: Native speech hosted candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bonsai-tools
      - uses: ./.github/actions/rust-toolchain
        id: rust
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Build both speech companions without fetching or loading model weights
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PINNED_TOOLCHAIN_PATH: ${{ steps.rust.outputs.toolchain-path }}
          BONSAI_SPEECH_SOURCE_ID: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'src/**', 'tools/bonsai/**', 'config/**') }}
          CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
          CARGO_BUILD_FINGERPRINT: content
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $IsWindows -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64' -or
              [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64' -or
              $env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_ARCH -cne 'ARM64' -or $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_REPOSITORY -cne 'symbiogenesis/SwiftBonsai2Runner' -or
              $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:BONSAI_SPEECH_SOURCE_ID -cnotmatch '^[a-f0-9]{64}$') {
            throw 'Native speech candidate preparation requires this repository main on hosted native Windows ARM64.'
          }
          # Later artifact actions receive their own runner environment. No
          # Actions/GitHub bearer credential enters compiler/build descendants.
          foreach ($name in @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNNER_INPUT_TOKEN')) {
            Remove-Item -LiteralPath ('Env:' + $name) -ErrorAction SilentlyContinue
          }
          $repo = $env:GITHUB_WORKSPACE
          Import-Module (Join-Path $repo 'scripts/Bonsai.Common.psm1')
          Import-Module (Join-Path $repo 'scripts/Bonsai.Native.psm1')
          $scratch = Resolve-ExternalPath (Join-Path $env:RUNNER_TEMP ('Bonsai-NativeSpeechCandidate-' + [guid]::NewGuid().ToString('N')))
          $package = Join-Path $scratch 'package'
          $evidence = Join-Path $scratch 'evidence'
          $working = Join-Path $scratch 'work'
          $data = Join-Path $scratch 'build-inputs'
          foreach ($directory in @($package, $evidence, $working, $data)) {
            [void][IO.Directory]::CreateDirectory($directory)
          }
          "BONSAI_SPEECH_CANDIDATE_PACKAGE=$package" >> $env:GITHUB_ENV
          "BONSAI_SPEECH_CANDIDATE_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $channel = 'nightly-2026-10-22-aarch64-pc-windows-msvc'
          $toolchain = Resolve-ExternalPath $env:PINNED_TOOLCHAIN_PATH
          $cargo = Join-Path $toolchain 'bin/cargo.exe'
          $rustc = Join-Path $toolchain 'bin/rustc.exe'
          $linker = Join-Path $toolchain 'lib/rustlib/aarch64-pc-windows-msvc/bin/rust-lld.exe'
          $receipt = [ordered]@{
            SchemaVersion=1; Scope='hosted-native-speech-build-only'
            Revision=$env:GITHUB_SHA; GitRef=$env:GITHUB_REF; Repository=$env:GITHUB_REPOSITORY
            RunId=$env:GITHUB_RUN_ID; RunAttempt=$env:GITHUB_RUN_ATTEMPT
            RunUrl="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ImageOS=$env:ImageOS; ImageVersion=$env:ImageVersion; Target='aarch64-pc-windows-msvc'
            SourceId=$env:BONSAI_SPEECH_SOURCE_ID; Toolchain=$channel; CompilerIdentity=$null; ToolImages=@()
            Operation='speech-build/build'; ModelSelection='All'; CheckedMaintenance=$null
            NativeDependencyPins=$null; NativeBuildHost=$null; NativeBuildReceipt=$null
            Files=@(); Status='preparing'; Failure=$null
            ModelWeightsFetched=$false; ModelExecuted=$false; SpeechCompanionsExecuted=$false
            DistributionQualified=$false; SigningQualified=$false; SpeechQualified=$false
            PerformanceQualified=$false; DefaultMayChange=$false
          }
          function Get-SpeechCandidateIdentity {
            [CmdletBinding()]
            [OutputType([Collections.Specialized.OrderedDictionary])]
            param([Parameter(Mandatory)][string]$Path)
            $file = Get-Item -LiteralPath $Path
            if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                $file.Length -gt 67108864) { throw 'Candidate outputs must be bounded regular files.' }
            [ordered]@{ Name=$file.Name; Bytes=$file.Length
              Sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          function Save-SpeechCandidateEvidence {
            [CmdletBinding()]
            [OutputType([void])]
            param()
            $logs = @((Join-Path $scratch 'rustc.txt'), (Join-Path $scratch 'build.txt'))
            $logs += @(Get-ChildItem -LiteralPath $working -File -Filter 'source-build-*.log' | Select-Object -First 4 -ExpandProperty FullName)
            $index = 0
            foreach ($path in $logs) {
              if (-not [IO.File]::Exists($path)) { continue }
              $stream = [IO.FileStream]::new($path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
              try {
                $count = [int][Math]::Min(65536, $stream.Length)
                [void]$stream.Seek(-$count, [IO.SeekOrigin]::End)
                $tail = [byte[]]::new($count)
                $stream.ReadExactly($tail, 0, $tail.Length)
                [IO.File]::WriteAllBytes((Join-Path $evidence ('build-tail-' + $index + '.txt')), $tail)
                $index++
              } finally { $stream.Dispose() }
            }
            $bytes = [Text.UTF8Encoding]::new($false).GetBytes(($receipt | ConvertTo-Json -Depth 20) + "`n")
            if ($bytes.Length -gt 65536) { throw 'Speech candidate receipt exceeds its fixed bound.' }
            [IO.File]::WriteAllBytes((Join-Path $evidence 'build-receipt.json'), $bytes)
          }
          Save-SpeechCandidateEvidence
          try {
            $receipt.ToolImages = @(foreach ($path in @($cargo, $rustc, $linker)) {
              Assert-Arm64PE $path
              [ordered]@{ Name=[IO.Path]::GetFileName($path); Bytes=(Get-Item -LiteralPath $path).Length
                Sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
            })
            $compiler = Invoke-BonsaiNativeProcess -Executable $rustc -WorkingDirectory $scratch -TimeoutSeconds 30 -LogPath (Join-Path $scratch 'rustc.txt') -ArgumentList @('-vV')
            if ($compiler.ExitCode -ne 0 -or $compiler.StandardOutput -notmatch 'host: aarch64-pc-windows-msvc') {
              throw 'The pinned native ARM64 compiler identity did not pass.'
            }
            $receipt.CompilerIdentity = $compiler.StandardOutput.Trim()
            $tool = Resolve-ExternalPath $env:BONSAI_TOOLS_PATH
            $toolReceipt = Get-Content -LiteralPath (Join-Path ([IO.Path]::GetDirectoryName($tool)) 'receipt.json') -Raw | ConvertFrom-Json
            if ($toolReceipt.SchemaVersion -ne 2 -or $toolReceipt.SourceId -cne $env:BONSAI_TOOLS_SOURCE_ID -or
                $toolReceipt.Toolchain -cne $channel -or
                $toolReceipt.Sha256 -cne (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()) {
              throw 'Checked maintenance source, toolchain or executable identity changed.'
            }
            Assert-Arm64PE $tool
            $receipt.CheckedMaintenance = $toolReceipt
            $pinPath = Join-Path $repo 'config/native-speech.lock.json'
            $receipt.NativeDependencyPins = Get-Content -LiteralPath $pinPath -Raw | ConvertFrom-Json
            $inputs = @(foreach ($relative in @('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml',
                'config/native-speech.lock.json', 'src/speech-asr/Cargo.toml', 'src/speech-asr/model.lock.json',
                'src/speech-tts/Cargo.toml', 'src/speech-tts/model.lock.json', 'src/speech-tts/model-q4.lock.json')) {
              $identity = Get-SpeechCandidateIdentity (Join-Path $repo $relative)
              [ordered]@{ Path=$relative; Bytes=$identity.Bytes; Sha256=$identity.Sha256 }
            })
            $inputs | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $package 'source-inputs.json') -Encoding utf8NoBOM
            # Model All selects the two build packages. This operation does not
            # call model provisioning or launch either speech service.
            $childScript = Join-Path $scratch 'build-speech.ps1'
            @'
          #requires -Version 7.6
          [CmdletBinding()]
          [OutputType([string])]
          param([Parameter(Mandatory)][string]$RepositoryRoot, [Parameter(Mandatory)][string]$DataDirectory,
            [Parameter(Mandatory)][string]$WorkingDirectory, [Parameter(Mandatory)][string]$ToolPath)
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module (Join-Path $RepositoryRoot 'scripts/Bonsai.NativeSpeech.psm1')
          $result = Invoke-NativeSpeechBuild -RepositoryRoot $RepositoryRoot -DataDirectory $DataDirectory -WorkingDirectory $WorkingDirectory -Model All -ToolPath $ToolPath
          $result | ConvertTo-Json -Depth 12 -Compress
          '@ | Set-Content -LiteralPath $childScript -Encoding utf8NoBOM
            $pwsh = @(Get-Command pwsh -CommandType Application -ErrorAction Stop)[0].Source
            $arguments = @('-NoProfile', '-NonInteractive', '-File', $childScript,
                '-RepositoryRoot', $repo, '-DataDirectory', $data, '-WorkingDirectory', $working, '-ToolPath', $tool)
            $receipt.Status = 'building'
            Save-SpeechCandidateEvidence
            $rustFlags = @('-C', "linker=$linker", '-C', 'linker-flavor=lld-link')
            $built = Invoke-BonsaiNativeProcess -Executable $pwsh -WorkingDirectory $scratch -TimeoutSeconds 1200 -OwnDescendants -LogPath (Join-Path $scratch 'build.txt') -ArgumentList $arguments -Environment @{
              RUSTC=$rustc; RUSTC_WRAPPER=''; RUSTC_WORKSPACE_WRAPPER=''
              CARGO_ENCODED_RUSTFLAGS=$rustFlags -join [char]0x1f
            }
            if ($built.ExitCode -ne 0 -or [Text.Encoding]::UTF8.GetByteCount($built.StandardOutput) -gt 65536) {
              throw 'Hosted native speech candidate build failed or returned oversized metadata.'
            }
            $result = $built.StandardOutput | ConvertFrom-Json
            $receipt.NativeBuildHost = $result.NativeBuildHost
            $target = [IO.Path]::GetDirectoryName([IO.Path]::GetDirectoryName([IO.Path]::GetDirectoryName($result.AsrPath)))
            if (-not $target.StartsWith($data + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Native speech build returned an unexpected target directory.'
            }
            $nativeReceipts = @(Get-ChildItem -LiteralPath $target -File -Filter 'startup-build-*.json')
            if ($nativeReceipts.Count -ne 1 -or $nativeReceipts[0].Length -gt 65536) {
              throw 'Exactly one bounded native speech build receipt is required.'
            }
            $native = Get-Content -LiteralPath $nativeReceipts[0].FullName -Raw | ConvertFrom-Json
            if ($native.version -ne 2 -or $native.fingerprint -cnotmatch '^[a-f0-9]{64}$' -or
                @($native.outputs.PSObject.Properties).Count -ne 2) { throw 'Native build receipt identity is invalid.' }
            $identitySha = [Convert]::ToHexStringLower([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($native.identity)))
            if ($nativeReceipts[0].BaseName -cne ('startup-build-' + $identitySha)) { throw 'Native build receipt identity digest differs.' }
            foreach ($entry in @(@{Name='bonsai-speech-asr';Path=$result.AsrPath}, @{Name='bonsai-speech-tts';Path=$result.TtsPath})) {
              $expected = Join-Path $target ('aarch64-pc-windows-msvc/release/' + $entry.Name + '.exe')
              $record = $native.outputs.($entry.Name)
              if ([IO.Path]::GetFullPath($entry.Path) -cne [IO.Path]::GetFullPath($expected) -or
                  [IO.Path]::GetFullPath($record.path) -cne [IO.Path]::GetFullPath($expected)) {
                throw 'Speech output path differs from its source-build receipt.'
              }
              Assert-Arm64PE $expected
              $identity = Get-SpeechCandidateIdentity $expected
              if ($identity.Sha256 -cne $record.sha256) { throw 'Speech output digest differs from its source-build receipt.' }
              [IO.File]::Copy($expected, (Join-Path $package ($entry.Name + '.exe')), $false)
            }
            [IO.File]::Copy($nativeReceipts[0].FullName, (Join-Path $package 'native-build-receipt.json'), $false)
            [IO.File]::Copy($pinPath, (Join-Path $package 'native-speech.lock.json'), $false)
            $result | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $package 'native-build-result.json') -Encoding utf8NoBOM
            $receipt.NativeBuildReceipt = [ordered]@{ IdentitySha256=$identitySha; Fingerprint=$native.fingerprint
              File=(Get-SpeechCandidateIdentity (Join-Path $package 'native-build-receipt.json')) }
            $receipt.Files = @(foreach ($name in @('bonsai-speech-asr.exe', 'bonsai-speech-tts.exe',
                'native-build-receipt.json', 'native-build-result.json', 'native-speech.lock.json', 'source-inputs.json')) {
              Get-SpeechCandidateIdentity (Join-Path $package $name)
            })
            $receipt.Status = 'completed'
            Save-SpeechCandidateEvidence
            [IO.File]::Copy((Join-Path $evidence 'build-receipt.json'), (Join-Path $package 'receipt.json'), $false)
          } catch {
            $receipt.Status = 'failed'
            $message = $_.Exception.Message
            $receipt.Failure = $message.Substring(0, [Math]::Min(4096, $message.Length))
            throw
          } finally { Save-SpeechCandidateEvidence }
          @('Hosted native ARM64 speech companions built from exact source without fetching model weights or launching either service.',
            'Review source/run/compiler/native-build receipts and both executable digests before explicit -AsrPath/-TtsPath use.',
            'Both prebuilt paths preserve automatic owned speech services while avoiding an owner-device native build.',
            'This unsigned candidate does not establish speech, distribution, signing, performance or default qualification.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain exact speech candidate binaries and source receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-speech-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/bonsai-speech-asr.exe
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/bonsai-speech-tts.exe
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/native-build-receipt.json
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/native-build-result.json
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/native-speech.lock.json
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/source-inputs.json
            ${{ env.BONSAI_SPEECH_CANDIDATE_PACKAGE }}/receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain bounded public-source speech build evidence
        if: always() && env.BONSAI_SPEECH_CANDIDATE_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-speech-candidate-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BONSAI_SPEECH_CANDIDATE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
