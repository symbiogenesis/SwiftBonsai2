name: Native runtime parity candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/bonsai/**'
      - 'src/artifacts/**'
      - 'src/broker/**'
      - 'scripts/Get-RuntimePromotion.ps1'
      - 'tests/Test-RuntimePromotion.ps1'
      - '.github/workflows/runtime-parity-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 35
    env:
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly-2026-10-22-aarch64-pc-windows-msvc
      - name: Check model-free native integration before promotion review
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'Runtime-Parity-Target'
          $evidence = Join-Path $env:RUNNER_TEMP 'Runtime-Parity-Evidence'
          [void][IO.Directory]::CreateDirectory($evidence)
          "RUNTIME_PARITY_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          Start-Transcript -LiteralPath (Join-Path $evidence 'checks.log') | Out-Null
          try {
            $manifest = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
            cargo +nightly-2026-10-22 fmt --manifest-path $manifest --all -- --check
            cargo +nightly-2026-10-22 clippy --manifest-path $manifest --locked --release -p bonsai-tools -p bonsai-artifacts -p bonsai-broker --all-targets -- -D warnings
            cargo +nightly-2026-10-22 test --manifest-path $manifest --locked --release -p bonsai-tools -p bonsai-artifacts --lib
            # Actual-model cases are explicitly ignored and never enabled here.
            cargo +nightly-2026-10-22 test --manifest-path $manifest --locked --release -p bonsai-broker --test native_model
            cargo +nightly-2026-10-22 build --manifest-path $manifest --locked --release -p bonsai-tools --bin bonsai-tools
            & (Join-Path $env:GITHUB_WORKSPACE 'tests/Test-RuntimePromotion.ps1') -ToolPath (Join-Path $env:CARGO_TARGET_DIR 'release/bonsai-tools.exe')
          } finally { Stop-Transcript | Out-Null }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.RUNTIME_PARITY_EVIDENCE != ''
        with:
          name: runtime-parity-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_PARITY_EVIDENCE }}
          if-no-files-found: error
