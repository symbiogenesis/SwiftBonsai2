name: Swift PTQ1 bounded decision screen
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-lora-snapdragon
  cancel-in-progress: false
jobs:
  screen:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, ARM64, swift-bonsai-snapdragon]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build packaged maintenance tools
        uses: ./.github/actions/bonsai-tools
      - name: Capture the small format comparison
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-Ptq1Screen.ps1'
          $data = Join-Path $env:LOCALAPPDATA 'SwiftBonsai2'
          # Keep upload credentials in this step, outside the evaluation tree.
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $PSHOME 'pwsh.exe'))
          $start.WorkingDirectory = $env:RUNNER_TEMP
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($argument in @('-NoProfile', '-File', $script, '-DataDirectory', $data)) {
            $start.ArgumentList.Add($argument)
          }
          foreach ($name in @('ACTIONS_RUNTIME_TOKEN', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN', 'GITHUB_TOKEN', 'GH_TOKEN', 'ACTIONS_RUNNER_INPUT_TOKEN')) {
            [void]$start.Environment.Remove($name)
          }
          $child = [Diagnostics.Process]::Start($start)
          try {
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            $child.WaitForExit()
            [Console]::Out.Write($stdout.GetAwaiter().GetResult())
            [Console]::Error.Write($stderr.GetAwaiter().GetResult())
            $code = $child.ExitCode
          } finally {
            try {
              if (-not $child.HasExited) { $child.Kill($true); $child.WaitForExit() }
            } finally { $child.Dispose() }
          }
          if ($code -ne 0) { throw 'PTQ1 screening failed; inspect retained startup/capture evidence.' }
          $entry = @(Get-Content -LiteralPath $env:GITHUB_ENV | Where-Object { $_.StartsWith('BONSAI_PTQ1_EVIDENCE=') })
          if ($entry.Count -ne 1) { throw 'PTQ1 screen evidence path is missing or ambiguous.' }
          $evidence = $entry[0].Substring('BONSAI_PTQ1_EVIDENCE='.Length)
          $result = Get-Content -LiteralPath (Join-Path $evidence 'screen-receipt.json') -Raw | ConvertFrom-Json
          @('PTQ1 screen captured. This is a reject-or-continue diagnostic, not profile qualification.',
            ('Screen status: ' + $result.ScreenStatus),
            '64-token prefixes do not establish complete-answer quality.',
            'Changed or unknown CPU conditions make timing inconclusive; rerun before a timing decision.',
            'Native adapter basis/logits and independent full-answer review remain separate requirements.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($result.ScreenStatus -ceq 'rejected') { throw 'The bounded screen rejected the candidate; inspect retained observations.' }
      - name: Retain screen observations and failures
        if: always() && env.BONSAI_PTQ1_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: swift-ptq1-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BONSAI_PTQ1_EVIDENCE }}/**/*.json
            ${{ env.BONSAI_PTQ1_EVIDENCE }}/**/*.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
