name: Rust nightly trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-nightly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.toolchain }} / ${{ matrix.group }}
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      # Collect every compiler/group verdict even when another lane fails.
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
        group: [Runtime, Broker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select external evidence and cache directories
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          TRIAL_TOOLCHAIN: ${{ matrix.toolchain }}
          TRIAL_GROUP: ${{ matrix.group }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-RustNightly-' + [guid]::NewGuid().ToString('N'))
          $target = Join-Path $env:RUNNER_TEMP "SwiftBonsai-RustTrialTargets/$env:TRIAL_TOOLCHAIN/$env:TRIAL_GROUP"
          foreach ($path in @($cargoHome, $evidence, $target)) {
            if (-not [IO.Path]::IsPathFullyQualified($path) -or $path -match '%[^%]+%') { throw 'Expected expanded absolute Cargo and evidence paths.' }
          }
          [void][IO.Directory]::CreateDirectory($evidence)
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          "RUST_TRIAL_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          "RUST_TRIAL_TARGET=$target" >> $env:GITHUB_ENV
          "RUST_TRIAL_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
      - name: Install and identify the pinned native Rust compiler
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          TRIAL_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Expected a native ARM64 runner process.' }
          $configuration = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'config/rust-nightly-trial.json') | ConvertFrom-Json -DateKind String -NoEnumerate
          if ($configuration.SchemaVersion -ne 1) { throw 'Unsupported Rust trial configuration schema.' }
          $toolchain = if ($env:TRIAL_TOOLCHAIN -eq 'stable') { $configuration.StableToolchain } else { $configuration.NightlyToolchain }
          rustup toolchain install $toolchain --profile minimal --component rustfmt,clippy --no-self-update 2>&1 | Tee-Object -FilePath (Join-Path $env:RUST_TRIAL_EVIDENCE 'install.log')
          $identity = @(rustc ('+' + $toolchain) -vV)
          if ($identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
          $identity | Tee-Object -FilePath (Join-Path $env:RUST_TRIAL_EVIDENCE 'rustc.txt')
          $digest = [Convert]::ToHexStringLower([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($identity -join "`n"))))
          "RUST_TRIAL_IDENTITY=$digest" >> $env:GITHUB_ENV
          "RUST_TRIAL_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
      - name: Reuse locked Cargo source downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Retain source downloads only; never cache credentials or Cargo home.
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: rust-trial-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'tools/prism/source.lock.json') }}
          restore-keys: |
            rust-trial-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Reuse compiler and group build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUST_TRIAL_TARGET }}
          key: rust-trial-targets-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ matrix.group }}-${{ env.RUST_TRIAL_CACHE_HOST }}-${{ env.RUST_TRIAL_IDENTITY }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'tools/prism/source.lock.json', 'rust-toolchain.toml', 'config/rust-nightly-trial.json') }}-${{ hashFiles('src/**/*.rs', 'tools/**/*.rs', 'scripts/Test-RustNightly.ps1', 'scripts/Test-Rust.ps1', 'scripts/Bonsai.Rust.psm1', 'config/rust-packages.psd1', 'scripts/Bonsai.Native.psm1', 'scripts/Bonsai.Common.psm1', 'rustfmt.toml', '.github/workflows/rust-nightly.yml') }}
          # Cargo validates fingerprints after either restore. Lockfile/config
          # changes can reuse unchanged dependencies without sharing compilers.
          restore-keys: |
            rust-trial-targets-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ matrix.group }}-${{ env.RUST_TRIAL_CACHE_HOST }}-${{ env.RUST_TRIAL_IDENTITY }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'tools/prism/source.lock.json', 'rust-toolchain.toml', 'config/rust-nightly-trial.json') }}-
            rust-trial-targets-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ matrix.group }}-${{ env.RUST_TRIAL_CACHE_HOST }}-${{ env.RUST_TRIAL_IDENTITY }}-
      - name: Formatting, Release analyzers, documentation and complete correctness suites
        id: checks
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          TRIAL_GROUP: ${{ matrix.group }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-RustNightly.ps1') -Mode Compatibility -FullTests -PackageGroup $env:TRIAL_GROUP -Toolchain $env:RUST_TRIAL_TOOLCHAIN -TargetDirectory $env:RUST_TRIAL_TARGET -EvidenceDirectory (Join-Path $env:RUST_TRIAL_EVIDENCE 'compatibility')
      - name: Record lane outcome
        if: always()
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          TRIAL_TOOLCHAIN: ${{ matrix.toolchain }}
          TRIAL_GROUP: ${{ matrix.group }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @(
            "Revision: $env:GITHUB_SHA"
            "Compiler: $env:RUST_TRIAL_TOOLCHAIN ($env:TRIAL_TOOLCHAIN)"
            "Package group: $env:TRIAL_GROUP"
            "Compatibility and complete correctness suites: $env:CHECKS_OUTCOME"
          ) >> $env:GITHUB_STEP_SUMMARY
      - name: Retain compiler identity, receipt and command logs
        if: always() && env.RUST_TRIAL_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-nightly-${{ matrix.toolchain }}-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUST_TRIAL_EVIDENCE }}
          if-no-files-found: error
  probe:
    name: Compiler acceptance probes
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned native compilers for metadata probes
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Expected a native ARM64 runner process.' }
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-RustProbe-' + [guid]::NewGuid().ToString('N'))
          if (-not [IO.Path]::IsPathFullyQualified($evidence) -or $evidence -match '%[^%]+%') { throw 'Expected an expanded absolute evidence path.' }
          [void][IO.Directory]::CreateDirectory($evidence)
          "RUST_TRIAL_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $configuration = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'config/rust-nightly-trial.json') | ConvertFrom-Json -DateKind String -NoEnumerate
          if ($configuration.SchemaVersion -ne 1) { throw 'Unsupported Rust trial configuration schema.' }
          foreach ($toolchain in @($configuration.StableToolchain, $configuration.NightlyToolchain)) {
            rustup toolchain install $toolchain --profile minimal --no-self-update 2>&1 | Tee-Object -FilePath (Join-Path $evidence ($toolchain + '-install.log'))
          }
      - name: Compare borrowing and trait-solver acceptance
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-RustNightly.ps1') -Mode Probe -FullTests -EvidenceDirectory (Join-Path $env:RUST_TRIAL_EVIDENCE 'probe')
      - name: Retain compiler identities, acceptance results and command logs
        if: always() && env.RUST_TRIAL_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-nightly-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUST_TRIAL_EVIDENCE }}
          if-no-files-found: error
  compatibility:
    name: compatibility
    if: always() && github.ref == 'refs/heads/main'
    needs: [checks, probe]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every compiler, package group and acceptance probe
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PROBE_RESULT: ${{ needs.probe.result }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @(
            "Revision: $env:GITHUB_SHA"
            "Stable/nightly x Runtime/Broker: $env:CHECKS_RESULT"
            "Compiler acceptance probes: $env:PROBE_RESULT"
            ''
            'Stable remains the production baseline. Compiler acceptance and correctness do not establish inference performance gains.'
            'Prism native linking and regression remain covered by the separate Foundation workflow.'
          ) >> $env:GITHUB_STEP_SUMMARY
          if ($env:CHECKS_RESULT -cne 'success' -or $env:PROBE_RESULT -cne 'success') {
            throw 'Every compiler/package group and the acceptance probes must succeed; failed, cancelled or skipped jobs are not accepted.'
          }
