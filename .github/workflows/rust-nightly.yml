name: Rust nightly trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select external evidence and cache directories
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $evidence = Join-Path $env:RUNNER_TEMP ('SwiftBonsai-RustNightly-' + [guid]::NewGuid().ToString('N'))
          $stableTarget = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-RustTrialTargets/stable'
          $nightlyTarget = Join-Path $env:RUNNER_TEMP 'SwiftBonsai-RustTrialTargets/nightly'
          foreach ($path in @($cargoHome, $evidence, $stableTarget, $nightlyTarget)) {
            if (-not [IO.Path]::IsPathFullyQualified($path) -or $path -match '%[^%]+%') { throw 'Expected expanded absolute Cargo and evidence paths.' }
          }
          [void][IO.Directory]::CreateDirectory($evidence)
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          "RUST_TRIAL_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          "RUST_TRIAL_STABLE_TARGET=$stableTarget" >> $env:GITHUB_ENV
          "RUST_TRIAL_NIGHTLY_TARGET=$nightlyTarget" >> $env:GITHUB_ENV
          "RUST_TRIAL_CACHE_HOST=$env:ImageOS-$env:ImageVersion-$([Environment]::OSVersion.Version)" >> $env:GITHUB_ENV
      - name: Install and identify pinned native stable and nightly Rust
        id: toolchains
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'Expected a native ARM64 runner process.' }
          $configuration = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'config/rust-nightly-trial.json') | ConvertFrom-Json -DateKind String
          if ($configuration.SchemaVersion -ne 1) { throw 'Unsupported Rust trial configuration schema.' }
          $toolchains = [ordered]@{
            STABLE = $configuration.StableToolchain
            NIGHTLY = $configuration.NightlyToolchain
          }
          foreach ($entry in $toolchains.GetEnumerator()) {
            $log = Join-Path $env:RUST_TRIAL_EVIDENCE ("install-$($entry.Key.ToLowerInvariant()).log")
            rustup toolchain install $entry.Value --profile minimal --component rustfmt,clippy --no-self-update 2>&1 | Tee-Object -FilePath $log
            $identity = @(rustc ("+" + $entry.Value) -vV)
            if ($identity -notcontains 'host: aarch64-pc-windows-msvc') { throw 'Expected native ARM64 Rust.' }
            $identity | Tee-Object -FilePath (Join-Path $env:RUST_TRIAL_EVIDENCE ("rustc-$($entry.Key.ToLowerInvariant()).txt"))
            $digest = [Convert]::ToHexStringLower([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($identity -join "`n"))))
            "RUST_TRIAL_$($entry.Key)_IDENTITY=$digest" >> $env:GITHUB_ENV
            "RUST_TRIAL_$($entry.Key)_TOOLCHAIN=$($entry.Value)" >> $env:GITHUB_ENV
          }
      - name: Reuse locked Cargo source downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Retain source downloads only; never cache credentials or Cargo home.
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: rust-trial-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'tools/prism/source.lock.json') }}
          restore-keys: |
            rust-trial-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Reuse stable build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUST_TRIAL_STABLE_TARGET }}
          key: rust-trial-stable-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TRIAL_CACHE_HOST }}-${{ env.RUST_TRIAL_STABLE_IDENTITY }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'tools/prism/source.lock.json', 'rust-toolchain.toml', 'config/rust-nightly-trial.json') }}-${{ hashFiles('src/**/*.rs', 'tools/**/*.rs', 'scripts/Test-RustNightly.ps1', 'rustfmt.toml') }}
          restore-keys: |
            rust-trial-stable-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TRIAL_CACHE_HOST }}-${{ env.RUST_TRIAL_STABLE_IDENTITY }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'tools/prism/source.lock.json', 'rust-toolchain.toml', 'config/rust-nightly-trial.json') }}-
      - name: Reuse nightly build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RUST_TRIAL_NIGHTLY_TARGET }}
          key: rust-trial-nightly-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TRIAL_CACHE_HOST }}-${{ env.RUST_TRIAL_NIGHTLY_IDENTITY }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'tools/prism/source.lock.json', 'rust-toolchain.toml', 'config/rust-nightly-trial.json') }}-${{ hashFiles('src/**/*.rs', 'tools/**/*.rs', 'scripts/Test-RustNightly.ps1', 'rustfmt.toml') }}
          restore-keys: |
            rust-trial-nightly-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TRIAL_CACHE_HOST }}-${{ env.RUST_TRIAL_NIGHTLY_IDENTITY }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'tools/prism/source.lock.json', 'rust-toolchain.toml', 'config/rust-nightly-trial.json') }}-
      - name: Stable baseline compatibility and complete Rust correctness suites
        id: stable
        if: always() && steps.toolchains.outcome == 'success'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-RustNightly.ps1') -Mode Compatibility -FullTests -Toolchain $env:RUST_TRIAL_STABLE_TOOLCHAIN -TargetDirectory $env:RUST_TRIAL_STABLE_TARGET -EvidenceDirectory (Join-Path $env:RUST_TRIAL_EVIDENCE 'stable')
      - name: Nightly candidate compatibility and complete Rust correctness suites
        id: nightly
        if: always() && steps.toolchains.outcome == 'success'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-RustNightly.ps1') -Mode Compatibility -FullTests -Toolchain $env:RUST_TRIAL_NIGHTLY_TOOLCHAIN -TargetDirectory $env:RUST_TRIAL_NIGHTLY_TARGET -EvidenceDirectory (Join-Path $env:RUST_TRIAL_EVIDENCE 'nightly')
      - name: Compare borrowing and trait-solver acceptance
        id: probe
        if: always() && steps.toolchains.outcome == 'success'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-RustNightly.ps1') -Mode Probe -FullTests -EvidenceDirectory (Join-Path $env:RUST_TRIAL_EVIDENCE 'probe')
      - name: Record trial scope and outcomes
        if: always()
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          STABLE_OUTCOME: ${{ steps.stable.outcome }}
          NIGHTLY_OUTCOME: ${{ steps.nightly.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @(
            'Pinned Rust nightly trial on native Windows ARM64.'
            "Revision: $env:GITHUB_SHA"
            "Stable toolchain: $env:RUST_TRIAL_STABLE_TOOLCHAIN"
            "Nightly toolchain: $env:RUST_TRIAL_NIGHTLY_TOOLCHAIN"
            ''
            "Stable compatibility: $env:STABLE_OUTCOME"
            "Nightly compatibility: $env:NIGHTLY_OUTCOME"
            "Compiler acceptance probe: $env:PROBE_OUTCOME"
            ''
            'The trial retains stable as the production baseline. Compiler acceptance and correctness do not establish inference performance gains.'
            'Prism native linking and regression remain covered by the separate Foundation workflow.'
          ) >> $env:GITHUB_STEP_SUMMARY
      - name: Retain compiler identities, acceptance results and command logs
        if: always() && env.RUST_TRIAL_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-nightly-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUST_TRIAL_EVIDENCE }}
          if-no-files-found: error
