name: Hexagon SDK generator provenance inventory
on:
  push:
    branches: [main, 'codex/hexagon-**']
    paths:
      - .github/workflows/hexagon-sdk-inventory.yml
      - scripts/Invoke-HexagonSdkInventory.ps1
      - tools/hexagon/sdk_inventory.py
      - tools/hexagon/sdk-inventory.lock.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-inventory:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inventory only the exact SDK archive and bounded review inputs
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-HexagonSdkInventory.ps1') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'SwiftBonsai-Hexagon-SDK-Inventory') | ConvertTo-Json -Depth 12
      - name: Retain bounded identities and necessary review excerpts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hexagon-sdk-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SwiftBonsai-Hexagon-SDK-Inventory/review
          if-no-files-found: warn
          retention-days: 90
