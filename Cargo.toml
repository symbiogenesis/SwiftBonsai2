[workspace]
resolver = "3"
exclude = ["third_party/simd-json"]
members = [
    "src/broker",
    "src/chat-ui",
    "src/speech-asr",
    "src/speech-tts",
    "src/speech-service",
    "src/audio",
    "src/artifacts",
    "src/cpu-policy",
    "src/windows-process",
    "src/windows-credentials",
    "tools/bonsai",
    "tools/ci",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The pinned nightly is required for Polonius lending in the broker.
rust-version = "1.101"
publish = false
license = "Apache-2.0"
repository = "https://github.com/symbiogenesis/SwiftBonsai2Runner"

[workspace.dependencies]
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }
tokio = "=1.54.1"
windows-sys = "=0.61.2"
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Bounds must fail visibly in optimized builds rather than wrap silently.
[profile.release]
overflow-checks = true
# Preserve subtle's constant-time release contract.
debug-assertions = false

[profile.test]
overflow-checks = true
debug-assertions = true

# Native-boundary crates permit individually documented unsafe operations.
# Safe package target roots additionally forbid unsafe code.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
non_ascii_idents = "forbid"
# Native-boundary unsafe allowances must never waive these safety checks.
unsafe_op_in_unsafe_fn = "forbid"
invalid_reference_casting = "forbid"
static_mut_refs = "forbid"
ffi_unwind_calls = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
unused_import_braces = "deny"
meta_variable_misuse = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
as_conversions = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes_without_reason = "deny"
