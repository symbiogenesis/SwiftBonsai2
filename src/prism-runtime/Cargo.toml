[package]
name = "bonsai-prism-runtime"
default-run = "bonsai-prism-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Bounded native Rust Qwen35 and Prism CPU reference runtime"
repository.workspace = true
keywords = ["inference", "ternary", "qwen35"]
categories = ["science"]

[features]
default = ["cli", "experimental-neon"]
cli = ["dep:serde", "dep:serde_json"]
experimental-neon = ["dep:fearless_simd"]

[[bin]]
name = "bonsai-prism-runtime"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "bonsai-token-worker"
path = "src/bin/token_worker.rs"
# Protocol regressions launch the ordinary binary; the root has no unit tests.
test = false
required-features = ["cli"]

[dependencies]
aho-corasick = "=1.1.5"
bonsai-ternary = { path = "../../tools/ternary" }
bonsai-gguf = { path = "../../tools/gguf", default-features = false }
bonsai-prism = { path = "../../tools/prism" }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
regex = "=1.13.1"
fancy-regex = "=0.14.0"
unicode-normalization-alignments = "=0.1.12"

[target.'cfg(all(target_arch = "aarch64", target_os = "windows", target_env = "msvc"))'.dependencies]
fearless_simd = { version = "=1.1.0", optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
# Independent Rust tokenizer references; native regex and C++ training are disabled.
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
sentencepiece-rs = { version = "=0.2.2", default-features = false }

[[example]]
name = "upstream_prism"
test = true
required-features = ["cli"]

[lints]
workspace = true
