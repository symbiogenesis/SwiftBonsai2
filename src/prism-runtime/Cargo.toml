[package]
name = "bonsai-prism-runtime"
default-run = "bonsai-prism-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Bounded native Rust Qwen35 and Prism CPU reference runtime"
repository.workspace = true
keywords = ["inference", "ternary", "qwen35"]
categories = ["science"]

[features]
default = ["cli", "experimental-neon"]
cli = ["dep:serde", "dep:serde_json"]
experimental-neon = ["dep:fearless_simd"]

[[bin]]
name = "bonsai-prism-runtime"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "bonsai-token-worker"
path = "src/bin/token_worker.rs"
# Protocol regressions launch the ordinary binary; the root has no unit tests.
test = false
required-features = ["cli"]

[dependencies]
bonsai-ternary = { path = "../../tools/ternary" }
bonsai-gguf = { path = "../../tools/gguf", default-features = false }
bonsai-prism = { path = "../../tools/prism" }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }

[target.'cfg(all(target_arch = "aarch64", target_os = "windows", target_env = "msvc"))'.dependencies]
fearless_simd = { version = "=1.1.0", optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[example]]
name = "upstream_prism"
test = true

[lints]
workspace = true
