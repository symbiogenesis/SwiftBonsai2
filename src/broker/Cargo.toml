[package]
name = "bonsai-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Bounded development chat transport and request supervision for the Bonsai broker"

[features]
native-swift = ["dep:bonsai-prism-runtime"]

[[bin]]
name = "bonsai-broker"
path = "src/main.rs"
# CLI behavior is covered by integration tests; this root has no unit tests.
test = false

[dependencies]
bonsai-prism-runtime = { path = "../prism-runtime", optional = true }
bonsai-artifacts = { path = "../artifacts" }
bonsai-cpu-policy = { path = "../cpu-policy" }
http = "=1.5.0"
httparse = "=1.10.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subtle = "=2.6.1"
tokio = { workspace = true, features = ["io-util", "net", "rt", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
bonsai-windows-process = { path = "../windows-process" }
bonsai-windows-credentials = { path = "../windows-credentials" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
