[package]
name = "bonsai-windows-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
keywords = ["windows", "process", "job-object", "supervision"]
categories = ["os::windows-apis"]
description = "Windows Job ownership and bounded native process lifecycle for Bonsai"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[features]
test-probe = ["windows-sys/Win32_System_Diagnostics_Debug"]

[[bin]]
name = "bonsai-process-test-probe"
path = "tests/support/probe.rs"
required-features = ["test-probe"]
test = false
doc = false

[lints]
workspace = true
