[package]
name = "bonsai-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
keywords = ["chat", "windows", "native", "llm", "rust"]
categories = ["gui"]
description = "Native Rust desktop chat for the local Swift Bonsai 2 broker"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
httparse = "=1.10.1"

[target.'cfg(windows)'.dependencies]
bonsai-audio = { path = "../audio" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }
bonsai-windows-credentials = { path = "../windows-credentials" }
bonsai-windows-process = { path = "../windows-process" }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility"] }
windows = { version = "=0.62.2", features = ["Win32_System_WinRT", "Foundation", "Media_Capture", "Media_MediaProperties", "Storage_Streams", "Security_Authorization_AppCapabilityAccess"] }
windows-future = "=0.3.2"

[target.'cfg(windows)'.dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu"] }
egui_system_font_provider = "=0.37.0"

[lints]
workspace = true
