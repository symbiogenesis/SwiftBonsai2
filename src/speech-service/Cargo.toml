[package]
name = "bonsai-speech-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded native speech companion HTTP, credentials, audio and inference supervision"
keywords = ["speech", "http", "native", "local", "audio"]
categories = ["network-programming", "multimedia::audio"]

[dependencies]
httparse = "=1.10.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
socket2 = "=0.6.5"
subtle = "=2.6.1"

[target.'cfg(windows)'.dependencies]
bonsai-windows-credentials = { path = "../windows-credentials" }
bonsai-windows-process = { path = "../windows-process" }

[lints]
workspace = true
