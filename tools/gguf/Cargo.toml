[package]
name = "bonsai-gguf"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Bounded GGUF inspection, pinned PQ2 census and exact PTQ1 export"
repository = "https://github.com/symbiogenesis/SwiftBonsai2"
keywords = ["ternary", "quantization", "scalar"]
categories = ["encoding", "science"]

[dependencies]
bonsai-bitcos = { path = "../bitcos" }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[profile.release]
overflow-checks = true
debug-assertions = false

[profile.test]
overflow-checks = true
debug-assertions = true

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_must_use = "deny"

[lints.rustdoc]
all = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# The repository has no project-wide license grant; do not invent one for this
# unpublished crate. All other package metadata is supplied above.
cargo_common_metadata = "allow"
as_conversions = "deny"
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
print_stdout = "deny"
print_stderr = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
