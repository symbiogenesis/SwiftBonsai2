[package]
name = "bonsai-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Packaged Windows supervision, credentials and qualification tooling"
repository.workspace = true
keywords = ["ternary", "quantization", "scalar"]
categories = ["encoding", "science"]

[[bin]]
name = "bonsai-tools"
path = "src/main.rs"
# Exercise the CLI through integration tests without linking an empty harness.
test = false

[dependencies]
bonsai-artifacts = { path = "../../src/artifacts" }
bonsai-cpu-policy = { path = "../../src/cpu-policy" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
bonsai-windows-process = { path = "../../src/windows-process" }
bonsai-windows-credentials = { path = "../../src/windows-credentials" }

[lints]
workspace = true
