[package]
name = "bonsai-dependency-trial"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "CI-only Windows ARM64 broker dependency comparison"
keywords = ["benchmark", "json", "async"]
categories = ["development-tools::profiling"]

[dependencies]
bonsai-broker = { path = "../../src/broker", features = ["dependency-trial"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
smol = "=2.0.2"
compio = { version = "=0.19.2", default-features = false, features = ["runtime", "net", "io", "time"] }

[lints]
workspace = true
